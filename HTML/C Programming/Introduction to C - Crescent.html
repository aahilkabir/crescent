<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to C — Crescent Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --surface:#0e0f11;
  --surface2:#181a1f;
  --surface3:#22252c;
  --border:rgba(255,255,255,.08);
  --border-hi:rgba(255,255,255,.16);
  --hi:#ffffff;
  --mid:#cbd5e1;
  --low:#64748b;
  --accent:#fbbf24; /* Gold */
  --accent-soft:rgba(251, 191, 36, 0.15);
  --blue:#38b6ff; /* Sky blue */
  --blue-soft:rgba(56, 182, 255, 0.15);
  --green:#10b981;
  --green-soft:rgba(16, 185, 129, 0.15);
  --rose:#f43f5e;
  --serif:'Cormorant Garamond',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  color:var(--hi);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#deck{position:relative;width:100vw;height:100vh;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:6vh 8vw;
  background:var(--black);
  opacity:0;visibility:hidden;
  transform:translateY(16px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1);
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;transform:translateY(0);}

.slide > *{position:relative;z-index:1;}

/* Step-by-Step Reveal Animation */
.step {
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.step.revealed {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

/* Cinematic Blended Image Layouts */
.cinematic-bg {
  position: relative;
  flex: 0.95;
  height: 380px;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  border: 1px solid var(--border-hi);
  box-shadow: 0 20px 45px rgba(0,0,0,0.55);
  pointer-events: none;
  opacity: 0;
  transform: scale(0.97) translateY(8px);
  transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
}
.cinematic-bg.revealed {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.eyebrow{
  font-family:var(--mono);
  font-size:clamp(0.85rem, 1.2vw, 1.1rem);
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.6em;
  font-weight:700;
}
.eyebrow::before{content:'';width:25px;height:2px;background:var(--accent-soft);display:inline-block;}

.title{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(3.0rem, 6.0vw, 5.0rem);
  line-height:1.08;
  letter-spacing:-.02em;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
  max-width:24ch;
}
.title.cool{
  background:linear-gradient(120deg,#ffffff,#e0f2fe 60%,var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.lede{
  font-family:var(--sans);
  font-size:clamp(1.4rem, 2.3vw, 2.0rem);
  color:var(--mid);
  line-height:1.6;
  max-width:55ch;
  font-weight:300;
}

.body-copy{
  font-size:clamp(1.3rem, 2.1vw, 1.8rem);
  line-height:1.7;
  color:var(--mid);
  max-width:65ch;
  font-weight:300;
}
.body-copy b, .body-copy strong{color:var(--hi);font-weight:600;}

.content-row{display:flex;gap:4vw;align-items:flex-start;margin-top:2rem;}

/* grids of small facts */
.fact-grid{display:grid;gap:1.2rem;margin-top:2rem;}
.fact-grid.cols-2{grid-template-columns:1fr 1fr;}
.fact-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.fact{background:var(--surface);border:1px solid var(--border);padding:1.8rem 2rem;border-radius:12px;}
.fact .num{font-family:var(--mono);color:var(--accent);font-size:0.9rem;letter-spacing:.12em;font-weight:700;}
.fact .txt{margin-top:.8rem;font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);line-height:1.6;font-weight:300;}
.fact .txt b{color:var(--hi);font-weight:600;}

/* timeline */
.timeline{margin-top:2rem;display:flex;flex-direction:column;gap:0;}
.tl-row{display:grid;grid-template-columns:120px 25px 1fr;column-gap:1.5rem;align-items:flex-start;padding:0.8rem 0;}
.tl-row .yr{font-family:var(--mono);color:var(--accent);font-size:1.1rem;text-align:right;padding-top:.15rem;font-weight:700;}
.tl-row .dot-col{display:flex;flex-direction:column;align-items:center;height:100%;}
.tl-row .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);margin-top:.45rem;}
.tl-row .line{flex:1;width:2px;background:var(--border-hi);margin-top:.3rem;min-height:50px;}
.tl-row:last-child .line{display:none;}
.tl-row .lbl{font-family:var(--serif);font-size:1.5rem;color:var(--hi);font-weight:600;}
.tl-row .sub{font-size:1.05rem;color:var(--mid);margin-top:.2rem;font-weight:300;}

/* code block */
.code{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.6rem 2.2rem;
  font-family:var(--mono);
  font-size:clamp(1.1rem, 1.7vw, 1.45rem);
  line-height:1.8;
  color:#e2e8f0;
  white-space:pre;
  overflow:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.code .kw{color:var(--accent);font-weight:700;}
.code .cm{color:var(--low);font-style:italic;}
.code .str{color:#a7f3d0;}
.code .fn{color:var(--blue);}
.code-cap{font-family:var(--mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--low);margin-bottom:.8rem;}

/* table */
.ptable{width:100%;border-collapse:collapse;margin-top:1.8rem;}
.ptable th{
  text-align:left;font-family:var(--mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);padding:1rem 1.4rem;border-bottom:2px solid var(--border-hi);font-weight:700;
}
.ptable td{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);font-weight:300;}
.ptable td:first-child, .ptable th:first-child{font-family:var(--mono);color:var(--hi);font-weight:600;}
.ptable tr:last-child td{border-bottom:none;}

/* pill / tag grid for keywords */
.pillgrid{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem;max-width:60ch;}
.pill{
  font-family:var(--mono);font-size:1.05rem;color:var(--mid);
  background:var(--surface);border:1px solid var(--border);
  padding:.5rem 1.1rem;border-radius:6px;
}

/* two-col layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2rem;align-items:start;}
.card-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem 2.2rem;}
.card-block h4{
  font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--hi);margin-bottom:1rem;
}
.card-block ul{list-style:none;}
.card-block li{
  font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);line-height:1.7;padding-left:1.3rem;position:relative;font-weight:300;margin-bottom:.5rem;
}
.card-block li::before{content:'—';position:absolute;left:0;color:var(--low);}

/* list simple */
.simple-list{margin-top:1.6rem;}
.simple-list li{
  font-size:clamp(1.2rem, 2.0vw, 1.7rem);color:var(--mid);line-height:1.8;list-style:none;padding-left:1.8rem;position:relative;font-weight:300;margin-bottom:.8rem;
}
.simple-list li::before{content:'·';position:absolute;left:0;color:var(--accent);font-size:2rem;line-height:0.9;}
.simple-list li b{color:var(--hi);font-weight:600;}

.split{display:flex;gap:4vw;margin-top:2rem;}
.split > div{flex:1;}

/* section divider slides */
.section-num{
  font-family:var(--mono);color:var(--accent);font-size:1.2rem;letter-spacing:.25em;margin-bottom:1.6rem;font-weight:700;
}
.section-title{
  font-family:var(--serif);font-weight:700;font-size:clamp(3.5rem,7vw,6.5rem);line-height:1.05;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
}
.section-list{margin-top:2rem;display:flex;flex-direction:column;gap:.8rem;}
.section-list .s-item{font-family:var(--sans);font-size:1.2rem;color:var(--low);font-weight:300;letter-spacing:.02em;}
.section-list .s-item.done{color:var(--low);text-decoration:line-through;opacity:0.4;}
.section-list .s-item.now{color:var(--hi);font-weight:500;}
.section-list .s-item.now::before{content:'→ ';color:var(--accent);}

/* Giant Typography watermark */
.giant-stat {
  position: absolute;
  right: 8vw;
  bottom: 12vh;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(8rem, 20vw, 18rem);
  color: transparent;
  -webkit-text-stroke: 2px rgba(251, 191, 36, 0.16);
  line-height: 0.9;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* Anatomy program stack layout */
.anatomy-stack {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  width: clamp(280px, 32vw, 420px);
  margin-left: auto;
}
.stack-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 1.1rem;
  text-align: center;
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--mid);
  border-radius: 6px;
  transition: border-color 0.4s ease, color 0.4s ease, background 0.4s ease;
}
.stack-box.active-box {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--surface3);
}

/* Flowchart block layout */
.flowchart {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  margin-top: 3rem;
  flex-wrap: wrap;
}
.fc-node {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 1.4rem 1.8rem;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 1.15rem;
  color: var(--hi);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.fc-arrow {
  font-size: 1.8rem;
  color: var(--low);
  font-family: var(--mono);
}

/* Interactive Terminal simulator styling */
.terminal-sim {
  background: #050505;
  border: 2px solid #222;
  border-radius: 8px;
  width: clamp(300px, 35vw, 450px);
  margin-left: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  overflow: hidden;
  font-family: var(--mono);
}
.term-header {
  background: #111;
  padding: 0.6rem 1rem;
  font-size: 0.8rem;
  color: var(--low);
  border-bottom: 1px solid #222;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.term-body {
  padding: 1.2rem;
  min-height: 120px;
  font-size: 1.15rem;
  color: #10b981; /* terminal green */
}
.term-line {
  margin-bottom: 0.6rem;
  line-height: 1.4;
  min-height: 1.5rem;
}
.term-line::before {
  content: '> ';
  color: var(--low);
}
.term-memory {
  background: #111;
  padding: 1rem;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.mem-label {
  font-size: 0.85rem;
  color: var(--low);
}
.mem-box {
  background: var(--surface3);
  border: 1px solid var(--border);
  padding: 0.4rem 1rem;
  border-radius: 4px;
  font-size: 1.1rem;
  color: var(--accent);
  font-weight: 600;
  transition: background 0.4s, border-color 0.4s;
}
.mem-box.updated {
  border-color: var(--green);
  background: var(--green-soft);
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
  color: var(--hi);
}

/* Quiz Option styling */
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  width: clamp(300px, 35vw, 450px);
  margin-left: auto;
}
.quiz-opt {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 1.2rem;
  border-radius: 8px;
  font-size: 1.15rem;
  color: var(--mid);
  cursor: pointer;
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}
.quiz-opt:hover {
  background: var(--surface3);
  border-color: var(--border-hi);
  color: var(--hi);
}
.quiz-opt.correct {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--hi);
}
.quiz-opt.incorrect {
  border-color: var(--rose);
  background: rgba(244, 63, 94, 0.15);
  color: var(--hi);
}

/* Code completion blank field styling */
.blank-fill {
  background: var(--surface2);
  border-bottom: 2px dashed var(--accent);
  padding: 0.1rem 1rem;
  color: transparent;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
  transition: all 0.3s;
  user-select: none;
}
.blank-fill:hover {
  background: var(--surface3);
}
.blank-fill.solved {
  border-bottom: none;
  color: var(--green);
  font-weight: 700;
  background: transparent;
}

/* Interactive Quiz Card layout */
.card-quiz {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.2rem;
  width: clamp(320px, 45vw, 600px);
  margin: 0 auto;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
.card-question {
  font-family: var(--serif);
  font-size: clamp(1.4rem, 2.3vw, 2.0rem);
  color: var(--hi);
  line-height: 1.5;
  margin-bottom: 1.8rem;
}
.card-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}
.quiz-btn {
  background: var(--surface3);
  border: 1px solid var(--border-hi);
  color: var(--mid);
  padding: 0.8rem 2.2rem;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 1.15rem;
  cursor: pointer;
  transition: all 0.3s;
}
.quiz-btn:hover {
  border-color: var(--hi);
  color: var(--hi);
}
.quiz-btn.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--hi);
}
.quiz-btn.incorrect {
  background: rgba(244,63,94,0.15);
  border-color: var(--rose);
  color: var(--hi);
}
.card-feedback {
  margin-top: 1.5rem;
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--green);
  transition: opacity 0.4s;
  min-height: 1.5rem;
}

/* nav ui */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s ease;box-shadow:0 0 10px var(--accent);}
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.8rem 8vw;z-index:50;
  pointer-events:none;
  font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--low);
}
#hud .count{pointer-events:auto;}
#hud .hint{opacity:.65;}
.navzone{position:fixed;top:0;bottom:0;width:15%;z-index:40;cursor:pointer;}
.navzone.left{left:0;}
.navzone.right{right:0;}

@media(max-width:820px){
  .two-col,.split,.flowchart{grid-template-columns:1fr;display:flex;flex-direction:column;}
  .slide{padding:4vh 5vw;}
  .fact-grid.cols-3{grid-template-columns:1fr;}
  .anatomy-stack,.terminal-sim,.quiz-options,.card-quiz{width:100%; margin-top:2rem;}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>
<div class="navzone left" onclick="go(-1)"></div>
<div class="navzone right" onclick="go(1)"></div>
<div id="hud">
  <div class="count"><span id="cur">01</span> / <span id="tot">00</span></div>
  <div class="hint">← → or Space to navigate · F fullscreen</div>
</div>

<script>
const slidesData = [];
function S(html, brace){ slidesData.push({html, brace: brace || (slidesData.length%2? '}':'{') }); }

/* ---------- 00 TITLE ---------- */
S(`
<div class="eyebrow">Crescent Institute of Science &amp; Technology · CSE</div>
<div class="title" style="font-size:clamp(4rem,12vw,9rem); font-weight:900;">C</div>
<div class="title small" style="margin-top:.4rem; font-size:clamp(2rem,4vw,3.5rem);">The Language That Built <span class="accent">Modern Computing</span></div>
<p class="lede" style="margin-top:1.8rem; max-width:65ch;">An introduction to structure, syntax, and the machine underneath — Dennis Ritchie's gift to the operating systems of the world.</p>
`);

/* ---------- 01 AGENDA ---------- */
S(`
<div class="eyebrow">Roadmap</div>
<div class="title" style="font-size:3rem;">What we'll build today</div>
<div class="fact-grid cols-3">
  <div class="fact step"><div class="num">01</div><div class="txt"><b>Origins &amp; History</b><br>Dennis Ritchie's Bell Labs breakthrough.</div></div>
  <div class="fact step"><div class="num">02</div><div class="txt"><b>Source → Machine</b><br>How code becomes binary electrical signals.</div></div>
  <div class="fact step"><div class="num">03</div><div class="txt"><b>Program Structure</b><br>The six anatomical sections of C code.</div></div>
  <div class="fact step"><div class="num">04</div><div class="txt"><b>Vocabulary &amp; Tokens</b><br>Reserved words, identifiers, and variables.</div></div>
  <div class="fact step"><div class="num">05</div><div class="txt"><b>Operators</b><br>Arithmetic, relational, logical, and bitwise logic.</div></div>
  <div class="fact step"><div class="num">06</div><div class="txt"><b>Terminal I/O</b><br>Talking to users with printf and scanf.</div></div>
</div>
`);

/* ---------- 02 SECTION DIVIDER: PART 1 ---------- */
S(`
<div class="section-num">Part 01</div>
<div class="section-title">Origins &amp;<br>Nature of C</div>
<div class="section-list">
  <div class="s-item now">Origins &amp; Dennis Ritchie's Legacy</div>
  <div class="s-item">Source → Machine compilation</div>
  <div class="s-item">Structure &amp; Anatomy of a Program</div>
  <div class="s-item">Variables &amp; Constants</div>
  <div class="s-item">Operators</div>
  <div class="s-item">Terminal Input / Output</div>
</div>
`, '{');

/* ---------- 02B DENNIS RITCHIE LEGACY ---------- */
S(`
<div class="eyebrow">Part 01 · Origins &amp; Nature</div>
<div class="title">Dennis Ritchie &amp; Unix</div>
<div class="split" style="align-items: center; gap: 4vw;">
  <div style="flex: 1.1;">
    <div class="body-copy">In 1972, at AT&amp;T Bell Labs, <b>Dennis Ritchie</b> designed the C programming language to rewrite the Unix operating system kernel.</div>
    <div class="body-copy step" style="margin-top:1.2rem;">By choosing to build C, he created a language that was high-level enough to be easily readable, yet low-level enough to talk directly to memory chips.</div>
    <div style="margin-top:1.8rem; padding:1.2rem; background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:0 8px 8px 0;" class="step">
      <span style="color:var(--hi); font-style:italic;">"C is quirky, flawed, and an enormous success."</span> — Dennis Ritchie
    </div>
  </div>
  <div style="flex: 0.9; height: 350px; border-radius: 12px; border: 1px solid var(--border-hi); background: url('../../assets/retro_computer_lab.jpg') center/cover; box-shadow: 0 20px 45px rgba(0,0,0,0.55);"></div>
</div>
`);

/* ---------- 03 WHAT IS C ---------- */
S(`
<div class="eyebrow">Part 01 · Origins &amp; Nature</div>
<div class="title">What is C?</div>
<div class="lede" style="margin-top:1.8rem;">A structured, third-generation programming language. It is a unique bridge: high-level enough to be human-readable, yet low-level enough to control raw hardware directly.</div>
<div class="content-row">
  <ul class="simple-list">
    <li class="step"><b>System Language:</b> Used to build OS cores like Unix, Linux, Windows, and MacOS.</li>
    <li class="step"><b>Embedded Powerhouse:</b> Controls everything from refrigerator chips to space rockets.</li>
    <li class="step"><b>Foundation:</b> C++ , Java, Python, and JavaScript compilers are all written in C.</li>
  </ul>
</div>
`);

/* ---------- 04 HISTORY ---------- */
S(`
<div class="eyebrow">Part 01 · Origins &amp; Nature</div>

  }
  .stack-box {
    cursor: pointer;
    transition: all 0.3s ease !important;
  }
  .stack-box.active-stack {
    border-color: #fbbf24 !important;
    background: rgba(251, 191, 36, 0.15) !important;
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.25) !important;
    color: #fbbf24 !important;
  }
  .code .num { color: #f43f5e; } /* pink for numbers */
  .code .inc { color: #fb923c; } /* orange for headers */
  .code .type { color: #60a5fa; font-weight: 700; } /* blue for types */
  .code .op { color: #fcd34d; } /* gold for operators */
  </style>

  <div class="code step" style="font-size:1.15rem; flex:1.2; line-height:1.6; white-space:pre-wrap;">
<div class="code-line" id="code-doc"><span class="cm">/* 1. Documentation Section */</span></div><div class="code-line" id="code-link"><span class="kw">#include</span> <span class="inc">&lt;stdio.h&gt;</span>    <span class="cm">/* 2. Link / Preprocessor */</span></div><div class="code-line" id="code-def"><span class="kw">#define</span> TAX <span class="num">5</span>        <span class="cm">/* 3. Definition Section */</span></div><div class="code-line" id="code-glob"><span class="type">int</span> globalScore;     <span class="cm">/* 4. Global Declaration */</span></div>
<div class="code-line" id="code-main"><span class="type">int</span> main()           <span class="cm">/* 5. Main Function Entry */</span>
{
    <span class="type">int</span> localVal <span class="op">=</span> <span class="num">5</span>;
    <span class="fn">printf</span>(<span class="str">"Value: %d"</span>, localVal);
    <span class="kw">return</span> <span class="num">0</span>;
}</div><div class="code-line" id="code-sub"><span class="type">void</span> subProgram()    <span class="cm">/* 6. Subprogram Section */</span>
{ }</div>
  </div>
  
  <div class="anatomy-stack">
    <div class="stack-box step" data-target="code-doc" id="st-doc">Documentation</div>
    <div class="stack-box step" data-target="code-link" id="st-link">Preprocessor Link</div>
    <div class="stack-box step" data-target="code-def" id="st-def">Definitions</div>
    <div class="stack-box step" data-target="code-glob" id="st-glob">Global Decl.</div>
    <div class="stack-box step" data-target="code-main" id="st-main">main() Function</div>
    <div class="stack-box step" data-target="code-sub" id="st-sub">Subprograms</div>
  </div>
</div>

<script>
(function() {
  const initHighlight = () => {
    const stackBoxes = document.querySelectorAll('.stack-box');
    const codeLines = document.querySelectorAll('.code-line');
    
    if (stackBoxes.length === 0 || codeLines.length === 0) {
      setTimeout(initHighlight, 100);
      return;
    }

    stackBoxes.forEach(box => {
      box.addEventListener('click', () => {
        stackBoxes.forEach(b => b.classList.remove('active-stack'));
        box.classList.add('active-stack');

        const targetId = box.getAttribute('data-target');
        codeLines.forEach(line => {
          if (line.id === targetId) {
            line.classList.add('active');
          } else {
            line.classList.remove('active');
          }
        });
      });
    });

    // Select documentation by default
    const docBox = document.getElementById('st-doc');
    if (docBox) docBox.click();
  };

  setTimeout(initHighlight, 200);
})();
<\/script>
`);

/* ================= RENDER + CONTROLLER ================= */
const deck = document.getElementById('deck');
slidesData.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('data-brace', s.brace);
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent = String(slideEls.length).padStart(2,'0');

let idx = 0;
function render(){
  slideEls.forEach((el,i)=> {
    el.classList.toggle('active', i===idx);
  });
  document.getElementById('cur').textContent = String(idx+1).padStart(2,'0');
  document.getElementById('progress').style.width = ((idx+1)/slideEls.length*100)+'%';
  
  // Highlight active stack boxes on Anatomy slide
  const activeSlide = slideEls[idx];
  const revealedStepsCount = activeSlide.querySelectorAll('.step.revealed').length;
  
  const stackBoxes = activeSlide.querySelectorAll('.stack-box');
  if(stackBoxes.length > 0) {
    stackBoxes.forEach((box, i) => {
      box.classList.toggle('active-box', i === (revealedStepsCount - 2)); 
    });
  }
  
  // Run Terminal Simulator Animation hooks
  const terminalBlock = activeSlide.querySelector('.terminal-sim');
  if(terminalBlock) {
    const l1 = document.getElementById('term-l1');
    const l2 = document.getElementById('term-l2');
    const memVal = document.getElementById('term-mem-val');
    
    if(revealedStepsCount === 1) {
      l1.textContent = "Enter score: ";
      l2.textContent = "";
      memVal.textContent = "?";
      memVal.classList.remove('updated');
    } else if(revealedStepsCount === 2) {
      l1.textContent = "Enter score: 85";
      l2.textContent = "";
      memVal.textContent = "85";
      memVal.classList.add('updated');
    } else if(revealedStepsCount === 3) {
      l1.textContent = "Enter score: 85";
      l2.textContent = "You passed!";
      memVal.textContent = "85";
      memVal.classList.add('updated');
    } else {
      l1.textContent = "";
      l2.textContent = "";
      memVal.textContent = "?";
      memVal.classList.remove('updated');
    }
  }
}

function checkQuiz(opt, isCorrect) {
  const opts = opt.parentNode.querySelectorAll('.quiz-opt');
  opts.forEach(o => {
    o.classList.remove('correct', 'incorrect');
    o.style.pointerEvents = 'none';
  });
  if (isCorrect) {
    opt.classList.add('correct');
    document.getElementById('quiz-explanation').style.opacity = '1';
    const codeBlock = document.getElementById('quiz-code-block');
    codeBlock.innerHTML = codeBlock.innerHTML.replace('int salary = 50000', '<span style="color:var(--green); font-weight:700;">int salary = 50000; // Fixed!</span>');
  } else {
    opt.classList.add('incorrect');
    opts.forEach(o => {
      if (o.textContent.includes('B)')) o.classList.add('correct');
    });
    document.getElementById('quiz-explanation').style.opacity = '1';
    document.getElementById('quiz-explanation').style.color = 'var(--rose)';
    document.getElementById('quiz-explanation').textContent = '❌ Incorrect. B is correct: line 4 is missing a semicolon.';
  }
}

function next() {
  const currentSlide = slideEls[idx];
  const nextStep = currentSlide.querySelector('.step:not(.revealed)');
  if (nextStep) {
    nextStep.classList.add('revealed');
    render();
  } else {
    if (idx < slideEls.length - 1) {
      idx++;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed'));
      // Reset quiz options and explanation when leaving or returning to quiz slide
      const quizExplanation = newSlide.querySelector('#quiz-explanation');
      if (quizExplanation) {
        quizExplanation.style.opacity = '0';
        const quizOpts = newSlide.querySelectorAll('.quiz-opt');
        quizOpts.forEach(o => {
          o.classList.remove('correct', 'incorrect');
          o.style.pointerEvents = 'auto';
        });
        const codeBlock = newSlide.querySelector('#quiz-code-block');
        if (codeBlock) {
          codeBlock.innerHTML = `#include &lt;stdio.h&gt;\nint main() \n{\n    int salary = 50000\n    printf("Salary is %d", salary);\n    return 0;\n}`;
        }
      }
      render();
    }
  }
}

function prev() {
  const currentSlide = slideEls[idx];
  const revealedSteps = currentSlide.querySelectorAll('.step.revealed');
  if (revealedSteps.length > 0) {
    revealedSteps[revealedSteps.length - 1].classList.remove('revealed');
    render();
  } else {
    if (idx > 0) {
      idx--;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step').forEach(s => s.classList.add('revealed'));
      render();
    }
  }
}

function go(delta) {
  if (delta > 0) next();
  else prev();
}

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ 
    idx=0; 
    slideEls.forEach(el => el.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed')));
    render(); 
  }
  else if(e.key==='End'){ 
    idx=slideEls.length-1; 
    slideEls.forEach(el => el.querySelectorAll('.step').forEach(s => s.classList.add('revealed')));
    render(); 
  }
  else if(e.key.toLowerCase()==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let touchX=null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
}, { passive: true });

render();
</script>

<script>
(function() {
  const overlay = document.getElementById('checkin-overlay');
  const form = document.getElementById('checkin-form');
  const rollInput = document.getElementById('chk-roll');
  const nameInput = document.getElementById('chk-name');
  const skipBtn = document.getElementById('chk-skip');

  const checkStatus = () => {
    const roll = localStorage.getItem('crescent_roll_number');
    const name = localStorage.getItem('crescent_name');
    const skip = localStorage.getItem('crescent_presenter_view');
    if ((roll && name) || skip === 'true') {
      overlay.style.display = 'none';
    }
  };

  checkStatus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const roll = rollInput.value.trim().toUpperCase();
    const name = nameInput.value.trim();
    
    try {
      const res = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, name })
      });
      if (res.ok) {
        localStorage.setItem('crescent_roll_number', roll);
        localStorage.setItem('crescent_name', name);
        localStorage.removeItem('crescent_presenter_view');
        overlay.style.display = 'none';
      } else {
        alert('Check-in failed. Please try again.');
      }
    } catch (err) {
      alert('Connection error. Please try again.');
    }
  });

  skipBtn.addEventListener('click', () => {
    localStorage.setItem('crescent_presenter_view', 'true');
    localStorage.removeItem('crescent_roll_number');
    localStorage.removeItem('crescent_name');
    overlay.style.display = 'none';
  });

  // Inject quiz click tracking
  window.recordResponse = async function(slideId, answer, isCorrect) {
    const roll = localStorage.getItem('crescent_roll_number');
    if (!roll) return;
    try {
      await fetch('/api/submit-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, slideId, answer, isCorrect })
      });
    } catch (err) {
      console.error(err);
    }
  };

  // Override verifyCard and solveBlank if they exist
  setTimeout(() => {
    const originalVerifyCard = window.verifyCard;
    window.verifyCard = function(btn, isCorrect, feedbackText) {
      if (originalVerifyCard) {
        originalVerifyCard(btn, isCorrect, feedbackText);
      }
      const cardQuestion = btn.closest('.card-quiz')?.querySelector('.card-question')?.textContent || 'Quiz Card';
      window.recordResponse(cardQuestion, btn.textContent, isCorrect);
    };

    const originalSolveBlank = window.solveBlank;
    window.solveBlank = function(el, val) {
      if (originalSolveBlank) {
        originalSolveBlank(el, val);
      }
      const blankTitle = el.closest('.slide')?.querySelector('.title')?.textContent || 'Code Blank';
      window.recordResponse(blankTitle, val, true);
    };
  }, 100);

  // Client-side C Code Syntax Highlighter
  const highlightCode = () => {
    const codeBlocks = document.querySelectorAll('pre.code, code.code, pre.code-template');
    codeBlocks.forEach(block => {
      if (block.querySelector('span.kw') || block.querySelector('span.type')) return;

      let html = block.innerHTML;

      // Comments
      html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
      html = html.replace(/(\/\/.*)/g, '<span class="cm">$1</span>');

      // Double quoted strings
      html = html.replace(/(".*?")/g, '<span class="str">$1</span>');

      // Preprocessor
      html = html.replace(/(#include|#define)/g, '<span class="kw">$1</span>');

      // Header imports
      html = html.replace(/(&lt;[a-zA-Z0-9_\.]+\.h&gt;)/g, '<span class="inc">$1</span>');

      // Keywords
      const keywords = ['return', 'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'break', 'continue', 'struct', 'union', 'typedef', 'const', 'static'];
      keywords.forEach(kw => {
        const regex = new RegExp(`\\b${kw}\\b`, 'g');
        html = html.replace(regex, `<span class="kw">${kw}</span>`);
      });

      // Types
      const types = ['int', 'float', 'char', 'double', 'void', 'unsigned', 'signed', 'long', 'short'];
      types.forEach(t => {
        const regex = new RegExp(`\\b${t}\\b`, 'g');
        html = html.replace(regex, `<span class="type">${t}</span>`);
      });

      // Common functions
      html = html.replace(/\b(printf|scanf|main|malloc|free|exit|pow|sqrt)\b/g, '<span class="fn">$1</span>');

      // Numbers
      html = html.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');

      block.innerHTML = html;
    });
  };

  setTimeout(highlightCode, 100);
})();
</script>
