<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Structures &amp; Arrays in C — Crescent Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --surface:#0e0f11;
  --surface2:#181a1f;
  --surface3:#22252c;
  --border:rgba(255,255,255,.08);
  --border-hi:rgba(255,255,255,.16);
  --hi:#ffffff;
  --mid:#cbd5e1;
  --low:#64748b;
  --accent:#fbbf24; /* Gold */
  --accent-soft:rgba(251, 191, 36, 0.15);
  --blue:#38b6ff; /* Sky blue */
  --blue-soft:rgba(56, 182, 255, 0.15);
  --green:#10b981;
  --green-soft:rgba(16, 185, 129, 0.15);
  --rose:#f43f5e;
  --serif:'Cormorant Garamond',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  color:var(--hi);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#deck{position:relative;width:100vw;height:100vh;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:6vh 8vw;
  background:var(--black);
  opacity:0;visibility:hidden;
  transform:translateY(16px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1);
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;transform:translateY(0);}

.slide > *{position:relative;z-index:1;}

/* Step-by-Step Reveal Animation */
.step {
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.step.revealed {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

/* Cinematic Blended Image Layouts */
.cinematic-bg {
  position: relative;
  flex: 0.95;
  height: 380px;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  border: 1px solid var(--border-hi);
  box-shadow: 0 20px 45px rgba(0,0,0,0.55);
  pointer-events: none;
  opacity: 0;
  transform: scale(0.97) translateY(8px);
  transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
}
.cinematic-bg.revealed {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.eyebrow{
  font-family:var(--mono);
  font-size:clamp(0.85rem, 1.2vw, 1.1rem);
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.6em;
  font-weight:700;
}
.eyebrow::before{content:'';width:25px;height:2px;background:var(--accent-soft);display:inline-block;}

.title{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(3.0rem, 6.0vw, 5.0rem);
  line-height:1.08;
  letter-spacing:-.02em;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
  max-width:24ch;
}
.title.cool{
  background:linear-gradient(120deg,#ffffff,#e0f2fe 60%,var(--blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.lede{
  font-family:var(--sans);
  font-size:clamp(1.4rem, 2.3vw, 2.0rem);
  color:var(--mid);
  line-height:1.6;
  max-width:55ch;
  font-weight:300;
}

.body-copy{
  font-size:clamp(1.3rem, 2.1vw, 1.8rem);
  line-height:1.7;
  color:var(--mid);
  max-width:65ch;
  font-weight:300;
}
.body-copy b, .body-copy strong{color:var(--hi);font-weight:600;}

.content-row{display:flex;gap:4vw;align-items:flex-start;margin-top:2rem;}

/* grids of small facts */
.fact-grid{display:grid;gap:1.2rem;margin-top:2rem;}
.fact-grid.cols-2{grid-template-columns:1fr 1fr;}
.fact-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.fact{background:var(--surface);border:1px solid var(--border);padding:1.8rem 2rem;border-radius:12px;}
.fact .num{font-family:var(--mono);color:var(--accent);font-size:0.9rem;letter-spacing:.12em;font-weight:700;}
.fact .txt{margin-top:.8rem;font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);line-height:1.6;font-weight:300;}
.fact .txt b{color:var(--hi);font-weight:600;}

/* code block */
.code{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.6rem 2.2rem;
  font-family:var(--mono);
  font-size:clamp(1.1rem, 1.7vw, 1.45rem);
  line-height:1.8;
  color:#e2e8f0;
  white-space:pre;
  overflow:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.code .kw{color:var(--accent);font-weight:700;}
.code .cm{color:var(--low);font-style:italic;}
.code .str{color:#a7f3d0;}
.code .fn{color:var(--blue);}
.code-cap{font-family:var(--mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--low);margin-bottom:.8rem;}

/* table */
.ptable{width:100%;border-collapse:collapse;margin-top:1.8rem;}
.ptable th{
  text-align:left;font-family:var(--mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);padding:1rem 1.4rem;border-bottom:2px solid var(--border-hi);font-weight:700;
}
.ptable td{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);font-weight:300;}
.ptable td:first-child, .ptable th:first-child{font-family:var(--mono);color:var(--hi);font-weight:600;}
.ptable tr:last-child td{border-bottom:none;}

/* pill / tag grid for keywords */
.pillgrid{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem;max-width:70ch;}
.pill{
  font-family:var(--mono);font-size:1.05rem;color:var(--mid);
  background:var(--surface);border:1px solid var(--border);
  padding:.5rem 1.1rem;border-radius:6px;
}

/* two-col layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2rem;align-items:start;}
.card-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem 2.2rem;}
.card-block h4{
  font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--hi);margin-bottom:1rem;
}
.card-block ul{list-style:none;}
.card-block li{
  font-size:clamp(1.1rem, 1.8vw, 1.5rem);color:var(--mid);line-height:1.7;padding-left:1.3rem;position:relative;font-weight:300;margin-bottom:.5rem;
}
.card-block li::before{content:'—';position:absolute;left:0;color:var(--low);}

/* list simple */
.simple-list{margin-top:1.6rem;}
.simple-list li{
  font-size:clamp(1.2rem, 2.0vw, 1.7rem);color:var(--mid);line-height:1.8;list-style:none;padding-left:1.8rem;position:relative;font-weight:300;margin-bottom:.8rem;
}
.simple-list li::before{content:'·';position:absolute;left:0;color:var(--accent);font-size:2rem;line-height:0.9;}
.simple-list li b{color:var(--hi);font-weight:600;}

.split{display:flex;gap:4vw;margin-top:2rem;}
.split > div{flex:1;}

/* section divider slides */
.section-num{
  font-family:var(--mono);color:var(--accent);font-size:1.2rem;letter-spacing:.25em;margin-bottom:1.6rem;font-weight:700;
}
.section-title{
  font-family:var(--serif);font-weight:700;font-size:clamp(3.5rem,7vw,6.5rem);line-height:1.05;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
}
.section-list{margin-top:2rem;display:flex;flex-direction:column;gap:.8rem;}
.section-list .s-item{font-family:var(--sans);font-size:1.2rem;color:var(--low);font-weight:300;letter-spacing:.02em;}
.section-list .s-item.done{color:var(--low);text-decoration:line-through;opacity:0.4;}
.section-list .s-item.now{color:var(--hi);font-weight:500;}
.section-list .s-item.now::before{content:'→ ';color:var(--accent);}

/* Giant Typography watermark */
.giant-stat {
  position: absolute;
  right: 8vw;
  bottom: 12vh;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(8rem, 20vw, 18rem);
  color: transparent;
  -webkit-text-stroke: 2px rgba(251, 191, 36, 0.16);
  line-height: 0.9;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* Interactive simulation widgets */
.sim-console {
  background: #050505;
  border: 2px solid #222;
  border-radius: 8px;
  width: clamp(300px, 35vw, 450px);
  margin-left: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  font-family: var(--mono);
}
.sim-header {
  background: #111;
  padding: 0.6rem 1rem;
  font-size: 0.8rem;
  color: var(--low);
  border-bottom: 1px solid #222;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.sim-body {
  padding: 1.2rem;
  min-height: 120px;
  font-size: 1.15rem;
  color: #10b981;
}
.sim-line {
  margin-bottom: 0.6rem;
  min-height: 1.5rem;
}
.sim-memory {
  background: #111;
  padding: 1rem;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sim-mem-box {
  background: var(--surface3);
  border: 1px solid var(--border);
  padding: 0.4rem 1rem;
  border-radius: 4px;
  font-size: 1.1rem;
  color: var(--accent);
  font-weight: 600;
  transition: all 0.4s;
}
.sim-mem-box.active {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--hi);
}

/* Array visualization rows */
.array-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 2rem;
}
.array-cell {
  background: var(--surface2);
  border: 1px solid var(--border);
  flex: 1;
  padding: 1.2rem;
  text-align: center;
  border-radius: 6px;
  font-family: var(--mono);
  transition: all 0.4s;
}
.array-cell.active-cell {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
}
.cell-val {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--hi);
}
.cell-idx {
  font-size: 0.8rem;
  color: var(--low);
  margin-top: 0.4rem;
}

/* nav ui */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s ease;box-shadow:0 0 10px var(--accent);}
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.8rem 8vw;z-index:50;
  pointer-events:none;
  font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--low);
}
#hud .count{pointer-events:auto;}
#hud .hint{opacity:.65;}
.navzone{position:fixed;top:0;bottom:0;width:15%;z-index:40;cursor:pointer;}
.navzone.left{left:0;}
.navzone.right{right:0;}

@media(max-width:820px){
  .two-col,.split{grid-template-columns:1fr;display:flex;flex-direction:column;}
  .slide{padding:4vh 5vw;}
  .fact-grid.cols-3{grid-template-columns:1fr;}
  .sim-console,.array-row{width:100%; margin-top:2rem;}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>
<div class="navzone left" onclick="go(-1)"></div>
<div class="navzone right" onclick="go(1)"></div>
<div id="hud">
  <div class="count"><span id="cur">01</span> / <span id="tot">00</span></div>
  <div class="hint">← → or Space to navigate · F fullscreen</div>
</div>

<script>
const slidesData = [];
function S(html, brace){ slidesData.push({html, brace: brace || (slidesData.length%2? '}':'{') }); }

/* ---------- 00 TITLE ---------- */
S(`
<div class="eyebrow">Crescent Institute of Science &amp; Technology · CSE</div>
<div class="title" style="font-size:clamp(4rem,10vw,8.5rem); font-weight:900;">C</div>
<div class="title small" style="margin-top:.4rem; font-size:clamp(2rem,4vw,3.5rem);">Module 3: <span class="accent">Control Structures &amp; Arrays</span></div>
<p class="lede" style="margin-top:1.8rem; max-width:65ch;">Mastering logic flow, repeat cycles, matrices, and text strings — from building loops to handling multi-dimensional data blocks.</p>
`);

/* ---------- 01 AGENDA ---------- */
S(`
<div class="eyebrow">Module 3 Roadmap</div>
<div class="title" style="font-size:3rem;">Syllabus Chapters</div>
<div class="fact-grid cols-3">
  <div class="fact step"><div class="num">01</div><div class="txt"><b>Decision Making</b><br>Decisions in code: if, if-else, switch case.</div></div>
  <div class="fact step"><div class="num">02</div><div class="txt"><b>Loop Structures</b><br>Repeating work: for, while, do-while loops.</div></div>
  <div class="fact step"><div class="num">03</div><div class="txt"><b>1D Arrays</b><br>Linear lists of identical data.</div></div>
  <div class="fact step"><div class="num">04</div><div class="txt"><b>2D Arrays</b><br>Grids and matrices in memory.</div></div>
  <div class="fact step"><div class="num">05</div><div class="txt"><b>Strings</b><br>Character arrays and string manipulation.</div></div>
</div>
`);

/* ---------- 02 SECTION DIVIDER: PART 1 ---------- */
S(`
<div class="section-num">Part 01</div>
<div class="section-title">Decision Making<br>in C</div>
<div class="section-list">
  <div class="s-item now">Decision Making (if, if-else, switch)</div>
  <div class="s-item">Loop Structures (for, while, do-while)</div>
  <div class="s-item">One-Dimensional Arrays</div>
  <div class="s-item">Two-Dimensional Arrays (Matrices)</div>
  <div class="s-item">Character Arrays &amp; Strings</div>
</div>
`, '{');

/* ---------- 03 DECISION MAKING OVERVIEW ---------- */
S(`
<div class="eyebrow">Part 01 · Decision Making</div>
<div class="title">Making Decisions in Code</div>
<div class="lede" style="margin-top:1.8rem;">Programs shouldn't execute in a straight, predictable line. They need to choose different paths based on conditions.</div>
<div class="content-row">
  <ul class="simple-list">
    <li class="step"><b>Conditional Branching:</b> Executing code only if an expression is True.</li>
    <li class="step"><b>Decision Statements:</b> <span class="mono" style="color:var(--accent);">if</span>, <span class="mono" style="color:var(--accent);">if-else</span>, nested <span class="mono" style="color:var(--accent);">if</span> ladders.</li>
    <li class="step"><b>Multi-way Branching:</b> Selecting one block out of many using <span class="mono" style="color:var(--accent);">switch-case</span>.</li>
  </ul>
</div>
`);

/* ---------- 04 IF-ELSE ANALOGY ---------- */
S(`
<div class="eyebrow">Part 01 · Decision Making</div>
<div class="title">if-else: The Helmet Checkpoint</div>
<div class="split">
  <div style="flex: 1.2;">
    <p class="lede">The <span class="mono" style="color:var(--accent);">if-else</span> statement evaluates a condition. If true, path A is taken; otherwise, path B is taken.</p>
    <ul class="simple-list" style="margin-top:1.4rem;">
      <li class="step"><b>Helmet Checkpoint:</b> Imagine a traffic checkpoint. The condition: "Is the rider wearing a helmet?"</li>
      <li class="step"><b>True (if block):</b> Helmet is present → Proceed safely home.</li>
      <li class="step"><b>False (else block):</b> No helmet → Stop and pay fine.</li>
    </ul>
  </div>
  <div class="card-block step">
    <h4>C Code Syntax</h4>
    <code class="mono" style="font-size:1.15rem; line-height:1.8; color:var(--accent);">
    if (helmet == 1)<br>
    {<br>
    &nbsp;&nbsp;printf("Safe Ride\n");<br>
    }<br>
    else<br>
    {<br>
    &nbsp;&nbsp;printf("Fine Rs. 1000\n");<br>
    }
    </code>
  </div>
</div>
`);

/* ---------- 05 SWITCH CASE ANALOGY ---------- */
S(`
<div class="eyebrow">Part 01 · Decision Making</div>
<div class="title">switch: The Elevator buttons</div>
<div class="split">
  <div style="flex:1.2;">
    <p class="lede">Instead of checking conditions sequentially (if/else if/else if), <span class="mono" style="color:var(--accent);">switch-case</span> jumps directly to the matching block.</p>
    <ul class="simple-list" style="margin-top:1.4rem;">
      <li class="step"><b>Elevator buttons:</b> You walk into a building elevator. You press "3". The lift goes directly to Floor 3.</li>
      <li class="step">It doesn't open the door at Floor 1, then Floor 2 to verify if you want to exit. Jumps directly!</li>
      <li class="step"><b>Default:</b> If you press an invalid floor number, the lift screen shows an error.</li>
    </ul>
  </div>
  <div class="card-block step">
    <h4>C Code Syntax</h4>
    <code class="mono" style="font-size:1.1rem; line-height:1.7; color:var(--accent);">
    switch (floor)<br>
    {<br>
    &nbsp;&nbsp;case 1: printf("Floor 1\n"); break;<br>
    &nbsp;&nbsp;case 2: printf("Floor 2\n"); break;<br>
    &nbsp;&nbsp;case 3: printf("Floor 3\n"); break;<br>
    &nbsp;&nbsp;default: printf("Error\n");<br>
    }
    </code>
  </div>
</div>
`);

/* ---------- 06 SWITCH RULES ---------- */
S(`
<div class="eyebrow">Part 01 · Decision Making</div>
<div class="title">Rules for switch-case</div>
<div class="split">
  <div class="card-block step">
    <h4>Key Rules</h4>
    <ul>
      <li>Switch expression must evaluate to an <b>integer</b> or a <b>character</b> constant. Floats are NOT allowed!</li>
      <li>Case labels must be constants (e.g. <span class="mono">case 1:</span> or <span class="mono">case 'A':</span>).</li>
      <li>No two case labels can be identical.</li>
      <li>The <span class="mono" style="color:var(--accent);">break;</span> statement exits the block. Omitting it leads to **Fall-Through**.</li>
    </ul>
  </div>
  <div>
    <div class="giant-stat step">switch</div>
  </div>
</div>
`);

/* ---------- 07 SECTION DIVIDER: PART 2 ---------- */
S(`
<div class="section-num">Part 02</div>
<div class="section-title">Loops &amp;<br>Iteration</div>
<div class="section-list">
  <div class="s-item done">Decision Making (if, if-else, switch)</div>
  <div class="s-item now">Loop Structures (for, while, do-while)</div>
  <div class="s-item">One-Dimensional Arrays</div>
  <div class="s-item">Two-Dimensional Arrays (Matrices)</div>
  <div class="s-item">Character Arrays &amp; Strings</div>
</div>
`, '}');

/* ---------- 08 LOOPS OVERVIEW ---------- */
S(`
<div class="eyebrow">Part 02 · Loops &amp; Iteration</div>
<div class="title">Repeating Work: Loops</div>
<div class="lede" style="margin-top:1.8rem;">Computers excel at repeating identical calculations a million times without getting tired. Loops are how we declare repetition.</div>
<div class="fact-grid cols-3" style="margin-top:1.6rem;">
  <div class="fact step"><div class="num">while</div><div class="txt">Entry-controlled loop. Checks condition first, loops if true.</div></div>
  <div class="fact step"><div class="num">for</div><div class="txt">Entry-controlled. Compact layout incorporating init, test, and update.</div></div>
  <div class="fact step"><div class="num">do-while</div><div class="txt">Exit-controlled loop. Executes statements at least once, checks condition at bottom.</div></div>
</div>
`);

/* ---------- 09 WHILE LOOP HERO ---------- */
S(`
<div class="eyebrow">Part 02 · Loops &amp; Iteration</div>
<div class="title">The Wet Grinder Analogy</div>
<div class="split" style="align-items: center; gap: 4vw;">
  <div style="flex: 1.1;">
    <p class="lede" style="font-size: 1.45rem; line-height: 1.6; margin-bottom: 2rem;">A <b>while loop</b> repeats actions while a condition remains True.</p>
    <div style="padding: 1.8rem; background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 1.25rem; color: var(--hi); line-height: 1.6; font-weight: 300;">
      Like grinding batter: You dump rice inside. As long as it is still coarse, the stone keeps rotating (repeats loop).
    </div>
  </div>
  <div class="cinematic-bg step" style="background-image: url('../../assets/wet_grinder.jpg');"></div>
</div>
`);

/* ---------- 09B WHILE LOOP STUDY ---------- */
S(`
<div class="eyebrow">Part 02 · Loops &amp; Iteration</div>
<div class="title">while Loops: Entry-Controlled</div>
<div class="split">
  <div style="flex:1.2;">
    <ul class="simple-list">
      <li class="step"><b>Condition Checked First:</b> Loop body executes only if the test matches.</li>
      <li class="step">If the condition starts as False, the loop executes exactly <b>zero</b> times.</li>
      <li class="step">Always ensure the variable updates inside the loop to avoid an <b>Infinite Loop</b>.</li>
    </ul>
  </div>
  <div>
    <div class="giant-stat step">while</div>
  </div>
</div>

/* ================= RENDER + CONTROLLER ================= */
const deck = document.getElementById('deck');
slidesData.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('data-brace', s.brace);
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent = String(slideEls.length).padStart(2,'0');

let idx = 0;
function render(){
  slideEls.forEach((el,i)=> {
    el.classList.toggle('active', i===idx);
  });
  document.getElementById('cur').textContent = String(idx+1).padStart(2,'0');
  document.getElementById('progress').style.width = ((idx+1)/slideEls.length*100)+'%';
  
  const activeSlide = slideEls[idx];
  const revealedStepsCount = activeSlide.querySelectorAll('.step.revealed').length;
  
  // Custom Loop Simulator Animation Hooks
  const loopTerm = document.getElementById('loop-term');
  const loopVal = document.getElementById('loop-val');
  if(loopTerm) {
    if(revealedStepsCount === 1) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'";
      loopVal.textContent = "1";
      loopVal.classList.add('active');
    } else if(revealedStepsCount === 2) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'<br><span style='color:var(--accent);'>i = 2:</span> i &lt;= 3 (True) → Print 'i is 2'";
      loopVal.textContent = "2";
      loopVal.classList.add('active');
    } else if(revealedStepsCount === 3) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'<br><span style='color:var(--accent);'>i = 2:</span> i &lt;= 3 (True) → Print 'i is 2'<br><span style='color:var(--accent);'>i = 3:</span> i &lt;= 3 (True) → Print 'i is 3'<br><span style='color:var(--rose);'>i = 4:</span> i &lt;= 3 (False) → Loop Terminates!";
      loopVal.textContent = "4";
      loopVal.classList.remove('active');
    } else {
      loopTerm.innerHTML = "<i>Press Space to trace loop steps...</i>";
      loopVal.textContent = "?";
      loopVal.classList.remove('active');
    }
  }
  
  // Custom Array Cell Highlight Hooks
  if (activeSlide.querySelector('.array-cell')) {
    const cells = activeSlide.querySelectorAll('.array-cell');
    cells.forEach((cell, i) => {
      cell.classList.toggle('active-cell', i === (revealedStepsCount - 1));
    });
    
    // Update Array formula text
    const formulaText = document.getElementById('addr-formula-text');
    if (formulaText && revealedStepsCount > 0 && revealedStepsCount <= 5) {
      const activeIdx = revealedStepsCount - 1;
      formulaText.innerHTML = `Address of J[${activeIdx}] = 1000 + ${activeIdx} * 4 = <span style="color:var(--green); font-weight:700;">${1000 + activeIdx * 4}</span>`;
    } else if (formulaText && revealedStepsCount === 6) {
      formulaText.innerHTML = `Formula: Address of J[i] = BaseAddress + i * sizeof(int)`;
    } else if (formulaText) {
      formulaText.innerHTML = `Formula: Address of J[i] = 1000 + i * 4`;
    }
    
    // String visualizer slide hooks
    const stringCheckText = document.getElementById('string-check-text');
    if (stringCheckText) {
      if (revealedStepsCount === 1) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'";
      } else if (revealedStepsCount === 2) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'<br>Read index 1: 'I' != '\\0' → print 'I'";
      } else if (revealedStepsCount === 3) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'<br>Read index 1: 'I' != '\\0' → print 'I'<br><span style='color:var(--rose);'>Read index 2: '\\0' == '\\0' → HALT!</span>";
      } else if (revealedStepsCount === 4) {
        stringCheckText.innerHTML = "Result printed on terminal: <span style='color:var(--green); font-weight:700; font-size:1.4rem;'>HI</span>";
      } else {
        stringCheckText.innerHTML = "C iterates printing chars until it reads '\\0', and then halts!";
      }
    }
  }
}

function next() {
  const currentSlide = slideEls[idx];
  const nextStep = currentSlide.querySelector('.step:not(.revealed)');
  if (nextStep) {
    nextStep.classList.add('revealed');
    render();
  } else {
    if (idx < slideEls.length - 1) {
      idx++;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed'));
      render();
    }
  }
}

function prev() {
  const currentSlide = slideEls[idx];
  const revealedSteps = currentSlide.querySelectorAll('.step.revealed');
  if (revealedSteps.length > 0) {
    revealedSteps[revealedSteps.length - 1].classList.remove('revealed');
    render();
  } else {
    if (idx > 0) {
      idx--;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step').forEach(s => s.classList.add('revealed'));
      render();
    }
  }
}

function go(delta) {
  if (delta > 0) next();
  else prev();
}

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ 
    idx=0; 
    slideEls.forEach(el => el.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed')));
    render(); 
  }
  else if(e.key==='End'){ 
    idx=slideEls.length-1; 
    slideEls.forEach(el => el.querySelectorAll('.step').forEach(s => s.classList.add('revealed')));
    render(); 
  }
  else if(e.key.toLowerCase()==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let touchX=null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
}, { passive: true });

render();
</script>

    <div style="font-size:3rem;margin-bottom:0.5rem;">🎓</div>
    <h2 style="margin-bottom:0.5rem;font-size:1.8rem;font-weight:700;">Classroom Check-in</h2>
    <p style="color:#64748b;font-size:0.95rem;margin-bottom:1.5rem;">Register your roll number and name to track slide activities.</p>
    
    <div style="text-align:left;margin-bottom:1rem;">
      <label style="font-family:monospace;font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.4rem;">Roll Number</label>
      <input type="text" id="chk-roll" placeholder="e.g. 23CSE01" required style="width:100%;padding:0.75rem 1rem;background:#181a1f;border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:6px;outline:none;font-size:1rem;">
    </div>
    
    <div style="text-align:left;margin-bottom:1.5rem;">
      <label style="font-family:monospace;font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.4rem;">Student Name</label>
      <input type="text" id="chk-name" placeholder="e.g. Arun Kumar" required style="width:100%;padding:0.75rem 1rem;background:#181a1f;border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:6px;outline:none;font-size:1rem;">
    </div>
    
    <button type="submit" style="width:100%;padding:0.8rem;background:#fbbf24;color:#000;border:none;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;transition:background 0.2s;">Register & Enter</button>
    <button type="button" id="chk-skip" style="width:100%;padding:0.8rem;background:transparent;color:#64748b;border:1px solid rgba(255,255,255,0.08);border-radius:6px;margin-top:0.8rem;cursor:pointer;font-size:0.95rem;">Presenter View</button>
  </form>
</div>

<script>
(function() {
  const overlay = document.getElementById('checkin-overlay');
  const form = document.getElementById('checkin-form');
  const rollInput = document.getElementById('chk-roll');
  const nameInput = document.getElementById('chk-name');
  const skipBtn = document.getElementById('chk-skip');

  const checkStatus = () => {
    const roll = localStorage.getItem('crescent_roll_number');
    const name = localStorage.getItem('crescent_name');
    const skip = localStorage.getItem('crescent_presenter_view');
    if ((roll && name) || skip === 'true') {
      overlay.style.display = 'none';
    }
  };

  checkStatus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const roll = rollInput.value.trim().toUpperCase();
    const name = nameInput.value.trim();
    
    try {
      const res = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, name })
      });
      if (res.ok) {
        localStorage.setItem('crescent_roll_number', roll);
        localStorage.setItem('crescent_name', name);
        localStorage.removeItem('crescent_presenter_view');
        overlay.style.display = 'none';
      } else {
        alert('Check-in failed. Please try again.');
      }
    } catch (err) {
      alert('Connection error. Please try again.');
    }
  });

  skipBtn.addEventListener('click', () => {
    localStorage.setItem('crescent_presenter_view', 'true');
    localStorage.removeItem('crescent_roll_number');
    localStorage.removeItem('crescent_name');
    overlay.style.display = 'none';
  });

  // Inject quiz click tracking
  window.recordResponse = async function(slideId, answer, isCorrect) {
    const roll = localStorage.getItem('crescent_roll_number');
    if (!roll) return;
    try {
      await fetch('/api/submit-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, slideId, answer, isCorrect })
      });
    } catch (err) {
      console.error(err);
    }
  };

  // Override verifyCard and solveBlank if they exist
  setTimeout(() => {
    const originalVerifyCard = window.verifyCard;
    window.verifyCard = function(btn, isCorrect, feedbackText) {
      if (originalVerifyCard) {
        originalVerifyCard(btn, isCorrect, feedbackText);
      }
      const cardQuestion = btn.closest('.card-quiz')?.querySelector('.card-question')?.textContent || 'Quiz Card';
      window.recordResponse(cardQuestion, btn.textContent, isCorrect);
    };

    const originalSolveBlank = window.solveBlank;
    window.solveBlank = function(el, val) {
      if (originalSolveBlank) {
        originalSolveBlank(el, val);
      }
      const blankTitle = el.closest('.slide')?.querySelector('.title')?.textContent || 'Code Blank';
      window.recordResponse(blankTitle, val, true);
    };
  }, 100);
})();
</script>
</body>

</html>
