<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Structures &amp; Arrays in C — Crescent Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --black:#000000;
  --surface:#0a0b0d;
  --surface2:#12141a;
  --surface3:#1a1d25;
  --border:rgba(255,255,255,.08);
  --border-hi:rgba(255,255,255,.16);
  --hi:#f8fafc;
  --mid:#cbd5e1;
  --low:#64748b;
  --accent:#f59e0b;
  --accent-soft:rgba(245,158,11,0.14);
  --blue:#38bdf8;
  --blue-soft:rgba(56,189,248,0.12);
  --green:#34d399;
  --green-soft:rgba(52,211,153,0.12);
  --rose:#fb7185;
  --rose-soft:rgba(251,113,133,0.12);
  --violet:#c084fc;
  --violet-soft:rgba(192,132,252,0.12);
  --serif:'Cormorant Garamond',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  color:var(--hi);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ========== SLIDE CORE (WITH SMOOTH VERTICAL SCROLL) ========== */
#deck{position:relative;width:100vw;height:100vh;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:flex-start;
  padding:6vh 9vw 16vh 9vw;
  background:var(--black);
  opacity:0;visibility:hidden;
  transform:translateY(12px) scale(0.995);
  transition:opacity .55s var(--ease-out-expo), transform .55s var(--ease-out-expo);
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(245,158,11,0.4) transparent;
}
.slide::-webkit-scrollbar{
  width:8px;
}
.slide::-webkit-scrollbar-track{
  background:rgba(255,255,255,0.02);
  border-radius:999px;
}
.slide::-webkit-scrollbar-thumb{
  background:rgba(245,158,11,0.35);
  border-radius:999px;
}
.slide::-webkit-scrollbar-thumb:hover{
  background:rgba(245,158,11,0.7);
}
.slide.active{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
.slide > *{position:relative;z-index:1;flex-shrink:0;}

/* Ambient corner glow on every slide */
.slide::before{
  content:'';position:absolute;
  top:-30%;right:-20%;width:60%;height:70%;
  background:radial-gradient(ellipse at center,rgba(245,158,11,0.04) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* Step reveal */
.step{
  opacity:0;
  transform:translateY(16px) scale(0.97);
  transition:opacity .5s var(--ease-out-expo), transform .5s var(--ease-out-expo);
  pointer-events:none;
}
.step.revealed{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}

/* Stagger delays */
.step.revealed:nth-child(2){transition-delay:.05s;}
.step.revealed:nth-child(3){transition-delay:.1s;}
.step.revealed:nth-child(4){transition-delay:.15s;}
.step.revealed:nth-child(5){transition-delay:.2s;}
.step.revealed:nth-child(6){transition-delay:.25s;}

/* Cinematic Hero Images */
.cinematic-bg{
  position:relative;flex:0.95;height:400px;
  background-size:cover;background-position:center;
  border-radius:16px;
  border:1px solid var(--border-hi);
  box-shadow:0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
  pointer-events:none;
  opacity:0;transform:scale(0.96) translateY(10px);
  transition:transform 1.1s var(--ease-out-expo), opacity .9s ease;
}
.cinematic-bg.revealed{opacity:1;transform:scale(1) translateY(0);}
.cinematic-bg::after{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6) 100%);
  pointer-events:none;
}

/* ========== BIGGER & CRISPER TYPOGRAPHY FOR LECTURE HALLS ========== */
.eyebrow{
  font-family:var(--mono);
  font-size:clamp(0.82rem, 1.1vw, 1.05rem);
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.8em;
  font-weight:700;
}
.eyebrow::before{
  content:'';width:32px;height:3px;
  background:linear-gradient(90deg, var(--accent), transparent);
  display:inline-block;
  border-radius:999px;
}

.title{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(3.2rem, 6.2vw, 5.2rem);
  line-height:1.06;
  letter-spacing:-.03em;
  background:linear-gradient(135deg,#ffffff 0%,#fef3c7 45%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  max-width:24ch;
}
.title.cool{
  background:linear-gradient(135deg,#ffffff 0%,#e0f2fe 45%,var(--blue) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.lede{
  font-family:var(--sans);
  font-size:clamp(1.4rem, 2.3vw, 2.15rem);
  color:var(--hi);
  line-height:1.68;
  max-width:58ch;
  font-weight:400;
  margin-top:1.2rem;
  letter-spacing:-0.01em;
}

.kicker{
  font-size:clamp(1.25rem, 1.9vw, 1.7rem);
  color:var(--mid);line-height:1.75;
  max-width:62ch;font-weight:400;
  margin-top:1rem;
}

.body-copy{
  font-size:clamp(1.25rem, 1.9vw, 1.75rem);
  line-height:1.78;
  color:var(--mid);
  max-width:64ch;
  font-weight:400;
}

/* Luminous Bold Styling */
b, strong{
  color:#ffffff !important;
  font-weight:700 !important;
  text-shadow:0 0 16px rgba(255,255,255,0.18);
}

/* ========== COLOR-CODED KEYWORD HIGHLIGHT BADGES ========== */
.hl-gold, .hl-amber{
  color:#fbbf24;
  background:rgba(251,191,36,0.13);
  padding:0.12em 0.45em;
  border-radius:6px;
  font-weight:600;
  border:1px solid rgba(251,191,36,0.28);
  display:inline-block;
}
.hl-blue, .hl-cyan{
  color:#38bdf8;
  background:rgba(56,189,248,0.13);
  padding:0.12em 0.45em;
  border-radius:6px;
  font-weight:600;
  border:1px solid rgba(56,189,248,0.28);
  display:inline-block;
}
.hl-green{
  color:#34d399;
  background:rgba(52,211,153,0.13);
  padding:0.12em 0.45em;
  border-radius:6px;
  font-weight:600;
  border:1px solid rgba(52,211,153,0.28);
  display:inline-block;
}
.hl-rose, .hl-red{
  color:#fb7185;
  background:rgba(251,113,133,0.13);
  padding:0.12em 0.45em;
  border-radius:6px;
  font-weight:600;
  border:1px solid rgba(251,113,133,0.28);
  display:inline-block;
}
.hl-violet, .hl-purple{
  color:#c084fc;
  background:rgba(192,132,252,0.13);
  padding:0.12em 0.45em;
  border-radius:6px;
  font-weight:600;
  border:1px solid rgba(192,132,252,0.28);
  display:inline-block;
}

.accent{color:var(--accent);}
.mono{font-family:var(--mono);}
.content-row{display:flex;gap:4vw;align-items:flex-start;margin-top:2rem;}

/* Code Block with macOS Dots & Larger Distance Font */
.code{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:2.6rem 2.4rem 1.8rem;
  font-family:var(--mono);
  font-size:clamp(1.05rem, 1.6vw, 1.45rem);
  line-height:1.9;
  color:#e2e8f0;
  white-space:pre;
  overflow-x:auto;
  box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,.02);
  position:relative;
}
.code::before{
  content:'';position:absolute;top:12px;left:16px;
  width:9px;height:9px;border-radius:50%;
  background:#ff5f57;
  box-shadow:18px 0 0 #febc2e, 36px 0 0 #28c840;
}
.code .kw{color:var(--accent);font-weight:700;}
.code .cm{color:var(--low);font-style:italic;}
.code .str{color:#6ee7b7;}
.code .fn{color:var(--blue);font-weight:600;}
.code .num{color:var(--rose);font-weight:600;}
.code .type{color:var(--blue);font-weight:700;}
.code .inc{color:var(--violet);}
.code .op{color:#fcd34d;}
.code .pp{color:var(--rose);}
.code-cap{font-family:var(--mono);font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;color:var(--low);margin-bottom:.8rem;}

/* Dissection Table - Larger Font */
.dissect-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:1.8rem;border-radius:14px;overflow:hidden;border:1px solid var(--border);}
.dissect-table th{font-family:var(--mono);font-size:0.85rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);padding:1rem 1.5rem;background:var(--surface2);border-bottom:1px solid var(--border-hi);text-align:left;font-weight:700;}
.dissect-table td{padding:0.95rem 1.5rem;border-bottom:1px solid var(--border);font-size:clamp(1.05rem,1.55vw,1.4rem);vertical-align:top;transition:background .2s;color:var(--hi);}
.dissect-table tr:last-child td{border-bottom:none;}
.dissect-table tr:hover td{background:var(--surface2);}
.dissect-table .dl{font-family:var(--mono);color:var(--blue);font-size:clamp(0.95rem,1.35vw,1.25rem);white-space:nowrap;font-weight:700;}
.dissect-table .de{color:var(--mid);font-weight:400;line-height:1.7;}

/* Inline code span */
.ic{font-family:var(--mono);font-size:0.9em;color:var(--blue);background:var(--surface2);padding:0.18em 0.5em;border-radius:5px;border:1px solid var(--border);font-weight:600;}

/* Fact Grid */
.fact-grid{display:grid;gap:1.2rem;margin-top:2rem;}
.fact-grid.cols-2{grid-template-columns:1fr 1fr;}
.fact-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.fact{
  background:var(--surface2);
  border:1px solid var(--border);
  padding:1.8rem 2rem;
  border-radius:14px;
  transition:border-color .4s ease, transform .3s ease;
}
.fact:hover{border-color:var(--border-hi);transform:translateY(-2px);}
.fact .num{
  font-family:var(--mono);color:var(--accent);
  font-size:0.85rem;letter-spacing:.15em;font-weight:700;
  text-transform:uppercase;
}
.fact .txt{
  margin-top:.9rem;font-size:clamp(1.15rem, 1.7vw, 1.5rem);
  color:var(--mid);line-height:1.7;font-weight:400;
}

/* Split & Two-col */
.split{display:flex;gap:4vw;margin-top:2rem;align-items:flex-start;}
.split > *{flex:1;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;margin-top:2rem;align-items:start;}

/* Card Blocks */
.card-block{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:2rem 2.2rem;
  backdrop-filter:blur(8px);
  transition:border-color .4s ease, transform .3s ease;
}
.card-block:hover{border-color:var(--border-hi);transform:translateY(-2px);}
.card-block h4{
  font-family:var(--serif);font-size:1.75rem;font-weight:700;color:var(--hi);margin-bottom:1rem;
}
.card-block ul{list-style:none;}
.card-block li{
  font-size:clamp(1.1rem, 1.6vw, 1.45rem);color:var(--mid);line-height:1.75;
  padding-left:1.4rem;position:relative;font-weight:400;margin-bottom:.6rem;
}
.card-block li::before{content:'—';position:absolute;left:0;color:var(--low);}

/* Story Box (Tamil Analogy) */
.story-card{
  background:linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(18,20,26,0.95) 100%);
  border:1px solid rgba(245,158,11,0.25);
  border-radius:16px;
  padding:2.2rem 2.6rem;
  margin-top:1.8rem;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}
.story-header{
  display:flex;align-items:center;gap:1.2rem;margin-bottom:1.4rem;
}
.story-icon{
  font-size:2.6rem;
}
.story-title{
  font-family:var(--serif);font-size:2rem;font-weight:700;color:var(--accent);line-height:1.2;
}
.story-tamil{
  font-family:var(--sans);font-size:1.2rem;color:var(--hi);font-style:italic;margin-bottom:1.2rem;line-height:1.65;font-weight:500;
}
.story-body{
  font-size:clamp(1.15rem, 1.7vw, 1.5rem);color:var(--mid);line-height:1.8;font-weight:400;
}

/* Insight Box */
.insight{
  margin-top:1.6rem;padding:1.2rem 1.8rem;
  background:var(--accent-soft);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;
  font-size:clamp(1.1rem, 1.6vw, 1.45rem);color:var(--hi);line-height:1.7;font-weight:400;
}
.insight.blue{background:var(--blue-soft);border-color:var(--blue);}
.insight.green{background:var(--green-soft);border-color:var(--green);}
.insight.rose{background:var(--rose-soft);border-color:var(--rose);}
.insight.violet{background:var(--violet-soft);border-color:var(--violet);}

/* Timeline */
.timeline{margin-top:2rem;display:flex;flex-direction:column;gap:0;}
.tl-row{display:grid;grid-template-columns:110px 25px 1fr;column-gap:1.6rem;align-items:flex-start;padding:0.8rem 0;}
.tl-row .yr{font-family:var(--mono);color:var(--accent);font-size:1.15rem;text-align:right;padding-top:.15rem;font-weight:700;}
.tl-row .dot-col{display:flex;flex-direction:column;align-items:center;height:100%;}
.tl-row .dot{
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft), 0 0 12px rgba(245,158,11,0.25);
  margin-top:.45rem;
}
.tl-row .line{flex:1;width:2px;background:linear-gradient(180deg,var(--border-hi),var(--border));margin-top:.3rem;min-height:50px;}
.tl-row:last-child .line{display:none;}
.tl-row .lbl{font-family:var(--serif);font-size:1.6rem;color:var(--hi);font-weight:700;}
.tl-row .sub{font-size:1.15rem;color:var(--mid);margin-top:.25rem;font-weight:400;}

/* Simple List */
.simple-list{margin-top:1.6rem;}
.simple-list li{
  font-size:clamp(1.15rem, 1.75vw, 1.55rem);color:var(--mid);line-height:1.85;
  list-style:none;padding-left:2rem;position:relative;font-weight:400;margin-bottom:.8rem;
}
.simple-list li::before{content:'';position:absolute;left:0;top:.75em;width:8px;height:8px;border-radius:50%;background:var(--accent);}

/* Section Dividers */
.section-num{
  font-family:var(--mono);color:var(--accent);
  font-size:1.2rem;letter-spacing:.3em;margin-bottom:1.6rem;font-weight:700;
}
.section-title{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(3.8rem,8vw,7rem);line-height:1.05;
  background:linear-gradient(135deg,#ffffff 0%,#fef3c7 45%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.section-list{margin-top:2.2rem;display:flex;flex-direction:column;gap:.75rem;}
.section-list .s-item{
  font-family:var(--sans);font-size:1.2rem;color:var(--low);
  font-weight:400;letter-spacing:.02em;
  padding:.4rem .9rem;border-radius:6px;
  transition:background .3s, color .3s;
}
.section-list .s-item.done{color:var(--low);text-decoration:line-through;opacity:0.35;}
.section-list .s-item.now{
  color:var(--hi);font-weight:600;
  background:var(--accent-soft);
  border-left:4px solid var(--accent);
  padding-left:1.3rem;
}
.section-list .s-item.now::before{content:'→ ';color:var(--accent);}

/* Giant Typography watermark */
.giant-stat{
  position:absolute;right:8vw;bottom:10vh;
  font-family:var(--serif);font-weight:700;
  font-size:clamp(9rem, 22vw, 20rem);
  color:transparent;
  -webkit-text-stroke:1.5px rgba(245, 158, 11, 0.12);
  line-height:0.9;
  pointer-events:none;user-select:none;z-index:0;
}

/* Quiz Card */
.card-quiz{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:18px;padding:2.6rem;
  width:clamp(340px, 52vw, 680px);margin:0 auto;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,0.7);
}
.card-question{
  font-family:var(--serif);font-size:clamp(1.45rem, 2.3vw, 2.1rem);
  color:var(--hi);line-height:1.5;margin-bottom:2rem;font-weight:700;
}
.card-buttons{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;}
.quiz-btn{
  background:var(--surface3);border:1px solid var(--border-hi);
  color:var(--hi);padding:0.85rem 2.4rem;border-radius:10px;
  font-family:var(--mono);font-size:1.15rem;font-weight:600;cursor:pointer;
  transition:all 0.3s var(--ease-out-expo);
}
.quiz-btn:hover{border-color:var(--hi);color:var(--hi);transform:translateY(-2px);}
.quiz-btn.correct{background:var(--green-soft);border-color:var(--green);color:var(--hi);}
.quiz-btn.incorrect{background:rgba(251,113,133,0.15);border-color:var(--rose);color:var(--hi);}
.card-feedback{margin-top:1.6rem;font-family:var(--mono);font-size:1.15rem;color:var(--green);transition:opacity 0.4s;min-height:1.6rem;font-weight:600;}

/* Code Blank */
.blank-fill{
  background:var(--surface2);border-bottom:3px dashed var(--accent);
  padding:0.15rem 1.2rem;color:transparent;cursor:pointer;
  border-radius:5px 5px 0 0;transition:all 0.3s;user-select:none;font-weight:700;
}
.blank-fill:hover{background:var(--surface3);}
.blank-fill.solved{border-bottom:none;color:var(--green);font-weight:700;background:transparent;}

/* To-do Card */
.todo-card{
  background:var(--surface2);border:1px solid var(--border);
  border-left:5px solid var(--violet);border-radius:16px;
  padding:2.2rem 2.8rem;max-width:75ch;
}
.todo-title{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--hi);margin-bottom:1.2rem;}
.todo-text{font-size:clamp(1.2rem,1.8vw,1.6rem);color:var(--hi);line-height:1.75;margin-bottom:1.2rem;font-weight:400;}
.todo-hint{font-family:var(--mono);font-size:1.05rem;color:var(--mid);padding:.9rem 1.2rem;background:var(--surface3);border-radius:8px;}

/* Navigation HUD */
#progress{
  position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--accent),#fcd34d);
  z-index:50;transition:width .4s ease;
  box-shadow:0 0 14px rgba(245,158,11,0.4), 0 0 5px rgba(245,158,11,0.6);
}
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.5rem 9vw;z-index:50;
  pointer-events:none;
  font-family:var(--mono);font-size:.82rem;letter-spacing:.15em;color:var(--low);
  background:linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent 100%);
}
#hud .count{
  pointer-events:auto;
  background:var(--surface2);border:1px solid var(--border);
  padding:.4rem 1.1rem;border-radius:999px;
  font-weight:700;color:var(--hi);font-size:0.9rem;
}
#hud .hint{opacity:.65;font-weight:500;}
.navzone{position:fixed;top:0;bottom:0;width:15%;z-index:40;cursor:pointer;}
.navzone.left{left:0;}
.navzone.right{right:0;}
.deck-meta{position:absolute;bottom:6vh;right:9vw;font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--low);}

@media(max-width:820px){
  .two-col,.split,.flowchart{grid-template-columns:1fr;display:flex;flex-direction:column;}
  .slide{padding:4vh 5vw 14vh 5vw;}
  .fact-grid.cols-3{grid-template-columns:1fr;}
}

</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>
<div class="navzone left" onclick="go(-1)"></div>
<div class="navzone right" onclick="go(1)"></div>
<div id="hud">
  <div class="count"><span id="cur">01</span> / <span id="tot">00</span></div>
  <div class="hint">← → or Space to navigate · F fullscreen</div>

/* ================= RENDER + CONTROLLER ================= */
const deck = document.getElementById('deck');
slidesData.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('data-brace', s.brace);
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const slideEls = Array.from(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent = String(slideEls.length).padStart(2,'0');

let idx = 0;
function render(){
  slideEls.forEach((el,i)=> {
    el.classList.toggle('active', i===idx);
  });
  document.getElementById('cur').textContent = String(idx+1).padStart(2,'0');
  document.getElementById('progress').style.width = ((idx+1)/slideEls.length*100)+'%';
  
  const activeSlide = slideEls[idx];
  const revealedStepsCount = activeSlide.querySelectorAll('.step.revealed').length;
  
  // Custom Loop Simulator Animation Hooks
  const loopTerm = document.getElementById('loop-term');
  const loopVal = document.getElementById('loop-val');
  if(loopTerm) {
    if(revealedStepsCount === 1) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'";
      loopVal.textContent = "1";
      loopVal.classList.add('active');
    } else if(revealedStepsCount === 2) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'<br><span style='color:var(--accent);'>i = 2:</span> i &lt;= 3 (True) → Print 'i is 2'";
      loopVal.textContent = "2";
      loopVal.classList.add('active');
    } else if(revealedStepsCount === 3) {
      loopTerm.innerHTML = "<span style='color:var(--accent);'>i = 1:</span> i &lt;= 3 (True) → Print 'i is 1'<br><span style='color:var(--accent);'>i = 2:</span> i &lt;= 3 (True) → Print 'i is 2'<br><span style='color:var(--accent);'>i = 3:</span> i &lt;= 3 (True) → Print 'i is 3'<br><span style='color:var(--rose);'>i = 4:</span> i &lt;= 3 (False) → Loop Terminates!";
      loopVal.textContent = "4";
      loopVal.classList.remove('active');
    } else {
      loopTerm.innerHTML = "<i>Press Space to trace loop steps...</i>";
      loopVal.textContent = "?";
      loopVal.classList.remove('active');
    }
  }
  
  // Custom Array Cell Highlight Hooks
  if (activeSlide.querySelector('.array-cell')) {
    const cells = activeSlide.querySelectorAll('.array-cell');
    cells.forEach((cell, i) => {
      cell.classList.toggle('active-cell', i === (revealedStepsCount - 1));
    });
    
    // Update Array formula text
    const formulaText = document.getElementById('addr-formula-text');
    if (formulaText && revealedStepsCount > 0 && revealedStepsCount <= 5) {
      const activeIdx = revealedStepsCount - 1;
      formulaText.innerHTML = `Address of J[${activeIdx}] = 1000 + ${activeIdx} * 4 = <span style="color:var(--green); font-weight:700;">${1000 + activeIdx * 4}</span>`;
    } else if (formulaText && revealedStepsCount === 6) {
      formulaText.innerHTML = `Formula: Address of J[i] = BaseAddress + i * sizeof(int)`;
    } else if (formulaText) {
      formulaText.innerHTML = `Formula: Address of J[i] = 1000 + i * 4`;
    }
    
    // String visualizer slide hooks
    const stringCheckText = document.getElementById('string-check-text');
    if (stringCheckText) {
      if (revealedStepsCount === 1) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'";
      } else if (revealedStepsCount === 2) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'<br>Read index 1: 'I' != '\\0' → print 'I'";
      } else if (revealedStepsCount === 3) {
        stringCheckText.innerHTML = "Read index 0: 'H' != '\\0' → print 'H'<br>Read index 1: 'I' != '\\0' → print 'I'<br><span style='color:var(--rose);'>Read index 2: '\\0' == '\\0' → HALT!</span>";
      } else if (revealedStepsCount === 4) {
        stringCheckText.innerHTML = "Result printed on terminal: <span style='color:var(--green); font-weight:700; font-size:1.4rem;'>HI</span>";
      } else {
        stringCheckText.innerHTML = "C iterates printing chars until it reads '\\0', and then halts!";
      }
    }
  }
}

function next() {
  const currentSlide = slideEls[idx];
  const nextStep = currentSlide.querySelector('.step:not(.revealed)');
  if (nextStep) {
    nextStep.classList.add('revealed');
    render();
  } else {
    if (idx < slideEls.length - 1) {
      idx++;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed'));
      render();
    }
  }
}

function prev() {
  const currentSlide = slideEls[idx];
  const revealedSteps = currentSlide.querySelectorAll('.step.revealed');
  if (revealedSteps.length > 0) {
    revealedSteps[revealedSteps.length - 1].classList.remove('revealed');
    render();
  } else {
    if (idx > 0) {
      idx--;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step').forEach(s => s.classList.add('revealed'));
      render();
    }
  }
}

function go(delta) {
  if (delta > 0) next();
  else prev();
}

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ 
    idx=0; 
    slideEls.forEach(el => el.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed')));
    render(); 
  }
  else if(e.key==='End'){ 
    idx=slideEls.length-1; 
    slideEls.forEach(el => el.querySelectorAll('.step').forEach(s => s.classList.add('revealed')));
    render(); 
  }
  else if(e.key.toLowerCase()==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let touchX=null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
}, { passive: true });

render();
</script>

<script>
(function() {
  const overlay = document.getElementById('checkin-overlay');
  const form = document.getElementById('checkin-form');
  const rollInput = document.getElementById('chk-roll');
  const nameInput = document.getElementById('chk-name');
  const skipBtn = document.getElementById('chk-skip');

  const checkStatus = () => {
    const roll = localStorage.getItem('crescent_roll_number');
    const name = localStorage.getItem('crescent_name');
    const skip = localStorage.getItem('crescent_presenter_view');
    if ((roll && name) || skip === 'true') {
      overlay.style.display = 'none';
    }
  };

  checkStatus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const roll = rollInput.value.trim().toUpperCase();
    const name = nameInput.value.trim();
    
    try {
      const res = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, name })
      });
      if (res.ok) {
        localStorage.setItem('crescent_roll_number', roll);
        localStorage.setItem('crescent_name', name);
        localStorage.removeItem('crescent_presenter_view');
        overlay.style.display = 'none';
      } else {
        alert('Check-in failed. Please try again.');
      }
    } catch (err) {
      alert('Connection error. Please try again.');
    }
  });

  skipBtn.addEventListener('click', () => {
    localStorage.setItem('crescent_presenter_view', 'true');
    localStorage.removeItem('crescent_roll_number');
    localStorage.removeItem('crescent_name');
    overlay.style.display = 'none';
  });

  // Inject quiz click tracking
  window.recordResponse = async function(slideId, answer, isCorrect) {
    const roll = localStorage.getItem('crescent_roll_number');
    if (!roll) return;
    try {
      await fetch('/api/submit-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, slideId, answer, isCorrect })
      });
    } catch (err) {
      console.error(err);
    }
  };

  // Override verifyCard and solveBlank if they exist
  setTimeout(() => {
    const originalVerifyCard = window.verifyCard;
    window.verifyCard = function(btn, isCorrect, feedbackText) {
      if (originalVerifyCard) {
        originalVerifyCard(btn, isCorrect, feedbackText);
      }
      const cardQuestion = btn.closest('.card-quiz')?.querySelector('.card-question')?.textContent || 'Quiz Card';
      window.recordResponse(cardQuestion, btn.textContent, isCorrect);
    };

    const originalSolveBlank = window.solveBlank;
    window.solveBlank = function(el, val) {
      if (originalSolveBlank) {
        originalSolveBlank(el, val);
      }
      const blankTitle = el.closest('.slide')?.querySelector('.title')?.textContent || 'Code Blank';
      window.recordResponse(blankTitle, val, true);
    };
  }, 100);

  // Client-side C Code Syntax Highlighter
  const highlightCode = () => {
    const codeBlocks = document.querySelectorAll('pre.code, code.code, pre.code-template');
    codeBlocks.forEach(block => {
      if (block.querySelector('span.kw') || block.querySelector('span.type')) return;

      let html = block.innerHTML;

      // Comments
      html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
      html = html.replace(/(\/\/.*)/g, '<span class="cm">$1</span>');

      // Double quoted strings
      html = html.replace(/(".*?")/g, '<span class="str">$1</span>');

      // Preprocessor
      html = html.replace(/(#include|#define)/g, '<span class="kw">$1</span>');

      // Header imports
      html = html.replace(/(&lt;[a-zA-Z0-9_\.]+\.h&gt;)/g, '<span class="inc">$1</span>');

      // Keywords
      const keywords = ['return', 'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'break', 'continue', 'struct', 'union', 'typedef', 'const', 'static'];
      keywords.forEach(kw => {
        const regex = new RegExp(`\\b${kw}\\b`, 'g');
        html = html.replace(regex, `<span class="kw">${kw}</span>`);
      });

      // Types
      const types = ['int', 'float', 'char', 'double', 'void', 'unsigned', 'signed', 'long', 'short'];
      types.forEach(t => {
        const regex = new RegExp(`\\b${t}\\b`, 'g');
        html = html.replace(regex, `<span class="type">${t}</span>`);
      });

      // Common functions
      html = html.replace(/\b(printf|scanf|main|malloc|free|exit|pow|sqrt)\b/g, '<span class="fn">$1</span>');

      // Numbers
      html = html.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');

      block.innerHTML = html;
    });
  };

  setTimeout(highlightCode, 100);
})();
</script>
