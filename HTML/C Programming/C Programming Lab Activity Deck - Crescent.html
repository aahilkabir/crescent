<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Programming Lab Activity Deck — Crescent Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --surface:#0e0f11;
  --surface2:#181a1f;
  --surface3:#22252c;
  --border:rgba(255,255,255,.08);
  --border-hi:rgba(255,255,255,.16);
  --hi:#ffffff;
  --mid:#cbd5e1;
  --low:#64748b;
  --accent:#fbbf24; /* Gold */
  --accent-soft:rgba(251, 191, 36, 0.15);
  --blue:#38b6ff; /* Sky blue */
  --blue-soft:rgba(56, 182, 255, 0.15);
  --green:#10b981;
  --green-soft:rgba(16, 185, 129, 0.15);
  --rose:#f43f5e;
  --serif:'Cormorant Garamond',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  color:var(--hi);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#deck{position:relative;width:100vw;height:100vh;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:6vh 8vw;
  background:var(--black);
  opacity:0;visibility:hidden;
  transform:translateY(16px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1);
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;transform:translateY(0);}

.slide > *{position:relative;z-index:1;}

/* Step-by-Step Reveal Animation */
.step {
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.step.revealed {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

/* Cinematic Blended Image Layouts */
.cinematic-bg {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 50%;
  background-size: cover;
  background-position: center;
  mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
  -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transform: scale(1.06) translateX(12px);
  transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
}
.cinematic-bg.revealed {
  opacity: 0.75;
  transform: scale(1.01) translateX(0);
}

.eyebrow{
  font-family:var(--mono);
  font-size:clamp(0.85rem, 1.2vw, 1.1rem);
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.6em;
  font-weight:700;
}
.eyebrow::before{content:'';width:25px;height:2px;background:var(--accent-soft);display:inline-block;}

.title{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(3.0rem, 6.0vw, 5.0rem);
  line-height:1.08;
  letter-spacing:-.02em;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
  max-width:24ch;
}

.lede{
  font-family:var(--sans);
  font-size:clamp(1.4rem, 2.3vw, 2.0rem);
  color:var(--mid);
  line-height:1.6;
  max-width:55ch;
  font-weight:300;
}

.body-copy{
  font-size:clamp(1.3rem, 2.1vw, 1.8rem);
  line-height:1.7;
  color:var(--mid);
  max-width:65ch;
  font-weight:300;
}
.body-copy b, .body-copy strong{color:var(--hi);font-weight:600;}

/* code block */
.code{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.6rem 2.2rem;
  font-family:var(--mono);
  font-size:clamp(1.1rem, 1.7vw, 1.45rem);
  line-height:1.8;
  color:#e2e8f0;
  white-space:pre;
  overflow:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.code .kw{color:var(--accent);font-weight:700;}
.code .cm{color:var(--low);font-style:italic;}
.code .str{color:#a7f3d0;}
.code .fn{color:var(--blue);}

/* simple-list */
.simple-list{margin-top:1.6rem;}
.simple-list li{
  font-size:clamp(1.2rem, 2.0vw, 1.7rem);color:var(--mid);line-height:1.8;list-style:none;padding-left:1.8rem;position:relative;font-weight:300;margin-bottom:.8rem;
}
.simple-list li::before{content:'·';position:absolute;left:0;color:var(--accent);font-size:2rem;line-height:0.9;}

.split{display:flex;gap:4vw;margin-top:2rem;}
.split > div{flex:1;}

/* section divider slides */
.section-num{
  font-family:var(--mono);color:var(--accent);font-size:1.2rem;letter-spacing:.25em;margin-bottom:1.6rem;font-weight:700;
}
.section-title{
  font-family:var(--serif);font-weight:700;font-size:clamp(3.5rem,7vw,6.5rem);line-height:1.05;
  background:linear-gradient(120deg,#ffffff,#fef3c7 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
}
.section-list{margin-top:2rem;display:flex;flex-direction:column;gap:.8rem;}
.section-list .s-item{font-family:var(--sans);font-size:1.2rem;color:var(--low);font-weight:300;letter-spacing:.02em;}
.section-list .s-item.now{color:var(--hi);font-weight:500;}
.section-list .s-item.now::before{content:'→ ';color:var(--accent);}

/* Swapping Cups Layout */
.cup-swapping-sim {
  margin-top: 2rem;
  width: 100%;
}
.cup-container {
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  height: 220px;
  max-width: 600px;
  margin: 0 auto;
}
.cup {
  width: 110px;
  height: 150px;
  border: 4px solid var(--border-hi);
  border-top: none;
  border-radius: 0 0 16px 16px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 10px;
}
.cup::before {
  content: '';
  position: absolute;
  top: 0; left: -4px; right: -4px;
  height: 4px;
  background: var(--border-hi);
}
.liquid {
  width: 100%;
  height: 0;
  border-radius: 0 0 12px 12px;
  transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.8s;
}
.liquid.gold {
  height: 80%;
  background: linear-gradient(180deg, rgba(251,191,36,0.8), rgba(251,191,36,0.3));
  box-shadow: 0 0 15px rgba(251,191,36,0.2);
}
.liquid.blue {
  height: 80%;
  background: linear-gradient(180deg, rgba(56,182,255,0.8), rgba(56,182,255,0.3));
  box-shadow: 0 0 15px rgba(56,182,255,0.2);
}
.liquid.empty {
  height: 0%;
  background: transparent;
}
.cup .label {
  position: absolute;
  bottom: -2.5rem;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.9rem;
  color: var(--low);
}

/* Piggy Bank accumulator visualizer */
.bank-sim {
  border: 2px dashed var(--border-hi);
  padding: 2rem;
  border-radius: 12px;
  text-align: center;
  max-width: 450px;
  margin-left: auto;
  background: var(--surface);
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.bank-title {
  font-family: var(--mono);
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--low);
}
.bank-val {
  font-size: clamp(3rem, 6vw, 4.5rem);
  font-weight: 700;
  color: var(--accent);
  margin-top: 1rem;
  font-family: var(--mono);
}
.bank-inputs {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  margin-top: 1.5rem;
}
.input-bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 1rem;
  color: var(--mid);
  transition: all 0.4s;
}
.input-bubble.added {
  background: var(--blue-soft);
  border-color: var(--blue);
  color: var(--hi);
  transform: translateY(-5px);
}

/* Even/Odd Gate style */
.gate-sim {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 2rem;
  max-width: 450px;
  margin-left: auto;
  background: var(--surface);
  text-align: center;
}
.gate-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 1.5rem;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--hi);
  margin-top: 1.5rem;
}
.gate-paths {
  display: flex;
  gap: 1.5rem;
  margin-top: 2rem;
}
.gate-path {
  flex: 1;
  padding: 1.2rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--low);
  transition: all 0.4s;
}
.gate-path.open-even {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--hi);
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
}
.gate-path.open-odd {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--hi);
  box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
}

/* Call Stack animation widgets */
.stack-container {
  display: flex;
  flex-direction: column-reverse;
  gap: 0.5rem;
  width: clamp(280px, 32vw, 420px);
  margin-left: auto;
  border-left: 4px solid var(--border);
  padding-left: 1.5rem;
  min-height: 250px;
  justify-content: flex-start;
}
.stack-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.4rem;
  font-family: var(--mono);
  font-size: 1rem;
  color: var(--mid);
  transform: translateY(20px) scale(0.95);
  opacity: 0;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.stack-card.active {
  transform: translateY(0) scale(1);
  opacity: 1;
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--hi);
}

/* Pointer address box list */
.ptr-visualizer {
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  margin-top: 1.5rem;
}
.ptr-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.4rem;
  font-family: var(--mono);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.4s;
}
.ptr-box.focused {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.15);
}

/* Giant Typography watermark */
.giant-stat {
  position: absolute;
  right: 8vw;
  bottom: 12vh;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(8rem, 20vw, 18rem);
  color: transparent;
  -webkit-text-stroke: 2px rgba(251, 191, 36, 0.16);
  line-height: 0.9;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* Interactive Quiz Card layout */
.card-quiz {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.2rem;
  width: clamp(320px, 45vw, 600px);
  margin: 0 auto;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
.card-question {
  font-family: var(--serif);
  font-size: clamp(1.4rem, 2.3vw, 2.0rem);
  color: var(--hi);
  line-height: 1.5;
  margin-bottom: 1.8rem;
}
.card-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}
.quiz-btn {
  background: var(--surface3);
  border: 1px solid var(--border-hi);
  color: var(--mid);
  padding: 0.8rem 2.2rem;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 1.15rem;
  cursor: pointer;
  transition: all 0.3s;
}
.quiz-btn:hover {
  border-color: var(--hi);
  color: var(--hi);
}
.quiz-btn.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--hi);
}
.quiz-btn.incorrect {
  background: rgba(244,63,94,0.15);
  border-color: var(--rose);
  color: var(--hi);
}
.card-feedback {
  margin-top: 1.5rem;
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--green);
  transition: opacity 0.4s;
  min-height: 1.5rem;
}

/* Code completion blank field styling */
.blank-fill {
  background: var(--surface2);
  border-bottom: 2px dashed var(--accent);
  padding: 0.1rem 1rem;
  color: transparent;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
  transition: all 0.3s;
  user-select: none;
}
.blank-fill:hover {
  background: var(--surface3);
}
.blank-fill.solved {
  border-bottom: none;
  color: var(--green);
  font-weight: 700;
  background: transparent;
}

/* To-Do Activity style card */
.todo-card {
  background: linear-gradient(135deg, #181a1f, #070809);
  border: 1px solid var(--accent-soft);
  border-radius: 12px;
  padding: 2.5rem;
  max-width: 75ch;
  margin: 0 auto;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
.todo-title {
  font-family: var(--mono);
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  font-weight: 700;
}
.todo-text {
  font-family: var(--serif);
  font-size: clamp(1.6rem, 2.8vw, 2.5rem);
  color: var(--hi);
  line-height: 1.4;
  margin-bottom: 1.5rem;
}
.todo-hint {
  font-size: 1.1rem;
  color: var(--low);
  line-height: 1.6;
  font-weight: 300;
}

/* nav ui */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:50;transition:width .4s ease;box-shadow:0 0 10px var(--accent);}
#hud{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.8rem 8vw;z-index:50;
  pointer-events:none;
  font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--low);
}
#hud .count{pointer-events:auto;}
#hud .hint{opacity:.65;}
.navzone{position:fixed;top:0;bottom:0;width:15%;z-index:40;cursor:pointer;}
.navzone.left{left:0;}
.navzone.right{right:0;}

@media(max-width:820px){
  .two-col,.split{grid-template-columns:1fr;display:flex;flex-direction:column;}
  .slide{padding:4vh 5vw;}
  .fact-grid.cols-2{grid-template-columns:1fr;}
  .cup-container,.bank-sim,.gate-sim,.stack-container,.ptr-visualizer,.card-quiz,.todo-card{width:100%; margin-top:2rem;}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>
<div class="navzone left" onclick="go(-1)"></div>
<div class="navzone right" onclick="go(1)"></div>
<div id="hud">
  <div class="count"><span id="cur">01</span> / <span id="tot">00</span></div>
  <div class="hint">← → or Space to navigate · F fullscreen</div>
</div>

<script>
const slidesData = [];
function S(html, brace){ slidesData.push({html, brace: brace || (slidesData.length%2? '}':'{') }); }

/* ---------- TITLE ---------- */
S(`
<div class="eyebrow">Crescent Institute of Science &amp; Technology · CSE</div>
<div class="title" style="font-size:clamp(3rem,7vw,6.5rem); font-weight:900;">PPS Lab Activities</div>
<div class="title small" style="margin-top:.4rem; font-size:clamp(1.8rem,3.5vw,3rem);"><span class="accent">20 Practical Code Challenges</span></div>
<p class="lede" style="margin-top:1.8rem; max-width:65ch;">Trace logic, watch 3D animations, and write structured code for all Programming for Problem Solving (PPS) laboratory exercises.</p>
`);

/* ---------- EX 1 ---------- */
S(`
<div class="eyebrow">Ex 01 · Terminal I/O</div>
<div class="title">My First C Program</div>
<div class="lede" style="margin-top:1.2rem;">Objective: Write a C program to display the message "This is my first C Program" on the terminal screen.</div>
<div class="code step" style="font-size:1.2rem; margin-top:1.5rem;">
#include &lt;stdio.h&gt;

int main() 
{
    printf("This is my first C program");
    return 0;
}
</div>
`);

/* ---------- EX 2 ---------- */
S(`
<div class="eyebrow">Ex 02 · Math Operators</div>
<div class="title">Sum &amp; Average of Three Numbers</div>
<div class="split" style="align-items: center;">
  <div class="code step" style="font-size:1.1rem; flex:1.2;">
#include &lt;stdio.h&gt;
int main() {
    int a, b, c, sum;
    float avg;
    printf("Enter three numbers: ");
    scanf("%d %d %d", &amp;a, &amp;b, &amp;c);
    
    sum = a + b + c;
    avg = sum / 3.0; // float division
    
    printf("Sum = %d\\nAvg = %.2f\\n", sum, avg);
    return 0;
}
  </div>
  <div class="bank-sim step">
    <div class="bank-title">Total Sum</div>
    <div class="bank-val" id="bank-total">0</div>
    <div class="bank-inputs">
      <div class="input-bubble" id="in1">10</div>
      <div class="input-bubble" id="in2">20</div>
      <div class="input-bubble" id="in3">15</div>
    </div>
  </div>
</div>
<div class="step"></div> <!-- step placeholder 1 -->
<div class="step"></div> <!-- step placeholder 2 -->
<div class="step"></div> <!-- step placeholder 3 -->
`);

/* ---------- EX 3 ---------- */
S(`
<div class="eyebrow">Ex 03 · Constants</div>
<div class="title">Circle Area &amp; Circumference</div>
<div class="code step" style="font-size:1.2rem; margin-top:1.5rem;">
#include &lt;stdio.h&gt;
#define PI 3.14159 // Unchangeable constant
 
int main() {
    int radius;
    float area, circumference;
    
    printf("Enter radius: ");
    scanf("%d", &amp;radius);
    
    area = PI * radius * radius;
    circumference = 2 * PI * radius;
    
    printf("Area = %.2f\\nCircumference = %.2f\\n", area, circumference);
    return 0;
}
</div>
`);

/* ---------- EX 4 ---------- */
S(`
<div class="eyebrow">Ex 04 · Decision Making</div>
<div class="title">Greatest of Three Numbers</div>
<div class="code step" style="font-size:1.1rem; margin-top:1.5rem;">
#include &lt;stdio.h&gt;
int main() {
    int num1, num2, num3;
    printf("Enter three integers: ");
    scanf("%d %d %d", &amp;num1, &amp;num2, &amp;num3);
    
    if (num1 &gt;= num2 &amp;&amp; num1 &gt;= num3) {
        printf("%d is largest\\n", num1);
    } else if (num2 &gt;= num1 &amp;&amp; num2 &gt;= num3) {
        printf("%d is largest\\n", num2);
    } else {
        printf("%d is largest\\n", num3);
    }
    return 0;
}
</div>
`);

/* ---------- EX 5 ---------- */
S(`
<div class="eyebrow">Ex 05 · Variables</div>
<div class="title">Swapping Values of Two Variables</div>
<div class="split" style="align-items:center;">
  <div style="flex:1.1;">
    <div class="body-copy">Interchanging values with Cup Swapping logic.</div>
    <ul class="simple-list">
      <li class="step"><b>Step 1:</b> <span class="mono">temp = x;</span> (Move Gold from X to Temp)</li>
      <li class="step"><b>Step 2:</b> <span class="mono">x = y;</span> (Move Blue from Y to X)</li>
      <li class="step"><b>Step 3:</b> <span class="mono">y = temp;</span> (Move Gold from Temp to Y)</li>
    </ul>
  </div>
  <div class="cup-swapping-sim step">
    <div class="cup-container">
      <div class="cup" id="cup-a"><div class="liquid gold"></div><div class="label">Cup X</div></div>
      <div class="cup" id="cup-temp"><div class="liquid empty"></div><div class="label">Cup Temp</div></div>
      <div class="cup" id="cup-b"><div class="liquid blue"></div><div class="label">Cup Y</div></div>
    </div>
  </div>
</div>
<div class="step"></div> <!-- step placeholder 1 -->
<div class="step"></div> <!-- step placeholder 2 -->
<div class="step"></div> <!-- step placeholder 3 -->
`);

/* ---------- TO-DO PRACTICE 1 (NEW) ---------- */
S(`
<div class="eyebrow">Challenge 01 · Practice Task</div>

  feedback.style.opacity = '1';
  if (isCorrect) {
    btn.classList.add('correct');
    feedback.textContent = feedbackText;
    feedback.style.color = "var(--green)";
  } else {
    btn.classList.add('incorrect');
    btns.forEach(b => {
      if (b !== btn) b.classList.add('correct');
    });
    feedback.textContent = feedbackText;
    feedback.style.color = "var(--rose)";
  }
}

function solveBlank(el, val) {
  el.textContent = val;
  el.classList.add('solved');
}

function next() {
  const currentSlide = slideEls[idx];
  const nextStep = currentSlide.querySelector('.step:not(.revealed)');
  if (nextStep) {
    nextStep.classList.add('revealed');
    render();
  } else {
    if (idx < slideEls.length - 1) {
      idx++;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed'));
      
      // Reset quiz card layouts when returning
      const quizExplanation = newSlide.querySelector('.card-feedback');
      if (quizExplanation) {
        quizExplanation.style.opacity = '0';
        const quizOpts = newSlide.querySelectorAll('.quiz-btn');
        quizOpts.forEach(o => {
          o.classList.remove('correct', 'incorrect');
          o.style.pointerEvents = 'auto';
        });
      }
      // Reset code completion blank solves when returning
      const solvedBlanks = newSlide.querySelectorAll('.blank-fill.solved');
      solvedBlanks.forEach(b => {
        b.classList.remove('solved');
        b.textContent = '______';
      });
      
      render();
    }
  }
}

function prev() {
  const currentSlide = slideEls[idx];
  const revealedSteps = currentSlide.querySelectorAll('.step.revealed');
  if (revealedSteps.length > 0) {
    revealedSteps[revealedSteps.length - 1].classList.remove('revealed');
    render();
  } else {
    if (idx > 0) {
      idx--;
      const newSlide = slideEls[idx];
      newSlide.querySelectorAll('.step').forEach(s => s.classList.add('revealed'));
      render();
    }
  }
}

function go(delta) {
  if (delta > 0) next();
  else prev();
}

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ 
    idx=0; 
    slideEls.forEach(el => el.querySelectorAll('.step.revealed').forEach(s => s.classList.remove('revealed')));
    render(); 
  }
  else if(e.key==='End'){ 
    idx=slideEls.length-1; 
    slideEls.forEach(el => el.querySelectorAll('.step').forEach(s => s.classList.add('revealed')));
    render(); 
  }
  else if(e.key.toLowerCase()==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let touchX=null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  touchX=null;
}, { passive: true });

render();
</script>



<!-- DATABASE CHECKIN OVERLAY -->
<div id="checkin-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;">
  <form id="checkin-form" style="background:#0e0f11;border:1px solid rgba(251,191,36,0.15);padding:3rem;border-radius:16px;max-width:420px;width:100%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.8);">
    <div style="font-size:3rem;margin-bottom:0.5rem;">🎓</div>
    <h2 style="margin-bottom:0.5rem;font-size:1.8rem;font-weight:700;">Classroom Check-in</h2>
    <p style="color:#64748b;font-size:0.95rem;margin-bottom:1.5rem;">Register your roll number and name to track slide activities.</p>
    
    <div style="text-align:left;margin-bottom:1rem;">
      <label style="font-family:monospace;font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.4rem;">Roll Number</label>
      <input type="text" id="chk-roll" placeholder="e.g. 23CSE01" required style="width:100%;padding:0.75rem 1rem;background:#181a1f;border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:6px;outline:none;font-size:1rem;">
    </div>
    
    <div style="text-align:left;margin-bottom:1.5rem;">
      <label style="font-family:monospace;font-size:0.75rem;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:0.4rem;">Student Name</label>
      <input type="text" id="chk-name" placeholder="e.g. Arun Kumar" required style="width:100%;padding:0.75rem 1rem;background:#181a1f;border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:6px;outline:none;font-size:1rem;">
    </div>
    
    <button type="submit" style="width:100%;padding:0.8rem;background:#fbbf24;color:#000;border:none;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;transition:background 0.2s;">Register & Enter</button>
    <button type="button" id="chk-skip" style="width:100%;padding:0.8rem;background:transparent;color:#64748b;border:1px solid rgba(255,255,255,0.08);border-radius:6px;margin-top:0.8rem;cursor:pointer;font-size:0.95rem;">Presenter View</button>
  </form>
</div>

<script>
(function() {
  const overlay = document.getElementById('checkin-overlay');
  const form = document.getElementById('checkin-form');
  const rollInput = document.getElementById('chk-roll');
  const nameInput = document.getElementById('chk-name');
  const skipBtn = document.getElementById('chk-skip');

  const checkStatus = () => {
    const roll = localStorage.getItem('crescent_roll_number');
    const name = localStorage.getItem('crescent_name');
    const skip = localStorage.getItem('crescent_presenter_view');
    if ((roll && name) || skip === 'true') {
      overlay.style.display = 'none';
    }
  };

  checkStatus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const roll = rollInput.value.trim().toUpperCase();
    const name = nameInput.value.trim();
    
    try {
      const res = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, name })
      });
      if (res.ok) {
        localStorage.setItem('crescent_roll_number', roll);
        localStorage.setItem('crescent_name', name);
        localStorage.removeItem('crescent_presenter_view');
        overlay.style.display = 'none';
      } else {
        alert('Check-in failed. Please try again.');
      }
    } catch (err) {
      alert('Connection error. Please try again.');
    }
  });

  skipBtn.addEventListener('click', () => {
    localStorage.setItem('crescent_presenter_view', 'true');
    localStorage.removeItem('crescent_roll_number');
    localStorage.removeItem('crescent_name');
    overlay.style.display = 'none';
  });

  // Inject quiz click tracking
  window.recordResponse = async function(slideId, answer, isCorrect) {
    const roll = localStorage.getItem('crescent_roll_number');
    if (!roll) return;
    try {
      await fetch('/api/submit-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, slideId, answer, isCorrect })
      });
    } catch (err) {
      console.error(err);
    }
  };

  // Override verifyCard and solveBlank if they exist
  setTimeout(() => {
    const originalVerifyCard = window.verifyCard;
    window.verifyCard = function(btn, isCorrect, feedbackText) {
      if (originalVerifyCard) {
        originalVerifyCard(btn, isCorrect, feedbackText);
      }
      const cardQuestion = btn.closest('.card-quiz')?.querySelector('.card-question')?.textContent || 'Quiz Card';
      window.recordResponse(cardQuestion, btn.textContent, isCorrect);
    };

    const originalSolveBlank = window.solveBlank;
    window.solveBlank = function(el, val) {
      if (originalSolveBlank) {
        originalSolveBlank(el, val);
      }
      const blankTitle = el.closest('.slide')?.querySelector('.title')?.textContent || 'Code Blank';
      window.recordResponse(blankTitle, val, true);
    };
  }, 100);
})();
</script>
</body>
